<!--
  VMS v2 — design sandbox (not part of the build). Single file, no external dependencies.
  Rework of vms-standalone.html around two rounds of review feedback (DA + AVP).
  Information architecture:
    My Requirements .. default. Requirement cards that change with the journey
                       (Requested > Quoted > Ordered > Completed),
                       one primary action per card, everything else in the overflow menu.
                       Detail page: shortlist with progress steps, sellers to review,
                       reminders, purchase order, rating, reorder.
    Find Sellers ..... search + filters; results split into "Your vendors" and "New sellers on IndiaMART".
    My Vendors ....... Shortlisted / Ordered from / Added by you. Add a vendor by uploading an invoice.
                       Vendor drawer: own rating (4 parameters), latest TrustProfile, files, order history.
    Templates ........ quote request (RFQ) templates with terms, purchase order templates.
  "Review notes" (header button) maps every feedback point to the screen that answers it.
    Price Check .... (paid) market price range, Low/Normal/High bands, quote check, 12-month trend, prices by city,
                       seller activity. Also inside each requirement (price card + a tag on every quote) and in Compare.
  Price Check uses only fields the 7 DWH price APIs return (sample run 24 Nov 2026, MCAT 6472 Flour Mill), on the
  Flour Mill requirement. For every other product the prototype assumes data in the same API shape (paGen). Sellers, quotes and requirements are mocked.
-->
<style>
/* Layout: IndiaMART dashboard shell (teal top bar + left nav) around a single scrolling work area with an optional right rail. */
:root{
  /* IndiaMART Desktop Style Guide: colour, type, elevation tokens */
  --bg:#ffffff; --surface:#ffffff; --surface-2:hsl(220,20%,97%); --surface-3:hsl(220,14%,92%);
  --line:hsl(220,14%,90%); --line-2:hsl(220,10%,84%);
  --ink:hsl(220,14%,10%); --ink-2:hsl(220,8%,35%); --ink-3:hsl(220,6%,46%); --ink-4:hsl(220,8%,72%);
  --brand:#1d8480; --brand-strong:hsl(178,63%,25%); --brand-active:hsl(178,63%,20%); --brand-light:hsl(178,45%,85%); --brand-wash:hsl(178,45%,94%); --brand-disabled:hsl(178,20%,70%); --brand-ink:#ffffff;
  --header:#2f318d; --navy:#2e3192; --navy-hover:hsl(239,52%,32%); --navy-wash:hsl(239,40%,92%);
  --info:#2483d4; --info-wash:hsl(208,72%,95%);
  --warn:#b8790a; --warn-wash:hsl(39,90%,94%); --warn-solid:#e89c0c;
  --good:#1a9e56; --good-wash:hsl(147,60%,94%);
  --bad:#dc3545; --bad-wash:hsl(354,70%,96%);
  --star:#eeb160; --star-off:hsl(220,14%,90%);
  --shadow:0 1px 3px 0 rgba(30,42,58,.06);
  --shadow-2:0 4px 12px -2px rgba(30,42,58,.08);
  --shadow-lg:0 12px 32px -4px rgba(30,42,58,.12);
  --scrim:rgba(15,23,42,.45);
  --font:"Inter",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#16201f; --surface-2:#1b2625; --surface-3:#22302e;
  --line:#2a3836; --line-2:#364744;
  --ink:#e6eeed; --ink-2:#c1cdcb; --ink-3:#8fa09e; --ink-4:#677775;
  --brand:#3bb3ac; --brand-strong:#5cc9c2; --brand-active:#7dd8d2; --brand-light:#1f4d4a; --brand-wash:#173a38; --brand-disabled:#2c4d4b; --brand-ink:#05201e; --navy-hover:#b3baff; --warn-solid:#f0b35b; --shadow-2:0 4px 12px -2px rgba(0,0,0,.4);
  --header:#2f318d; --navy:#9aa3ff; --navy-wash:#232845;
  --info:#8fb0ff; --info-wash:#1b2643;
  --warn:#f0b35b; --warn-wash:#3a2a12;
  --good:#6fd39a; --good-wash:#14301f;
  --bad:#ff8a8a; --bad-wash:#3a1818;
  --star:#f2bf33; --star-off:#33423f;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#16201f; --surface-2:#1b2625; --surface-3:#22302e;
  --line:#2a3836; --line-2:#364744;
  --ink:#e6eeed; --ink-2:#c1cdcb; --ink-3:#8fa09e; --ink-4:#677775;
  --brand:#3bb3ac; --brand-strong:#5cc9c2; --brand-active:#7dd8d2; --brand-light:#1f4d4a; --brand-wash:#173a38; --brand-disabled:#2c4d4b; --brand-ink:#05201e; --navy-hover:#b3baff; --warn-solid:#f0b35b; --shadow-2:0 4px 12px -2px rgba(0,0,0,.4);
  --header:#2f318d; --navy:#9aa3ff; --navy-wash:#232845;
  --info:#8fb0ff; --info-wash:#1b2643;
  --warn:#f0b35b; --warn-wash:#3a2a12;
  --good:#6fd39a; --good-wash:#14301f;
  --bad:#ff8a8a; --bad-wash:#3a1818;
  --star:#f2bf33; --star-off:#33423f;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;height:100%;overflow:hidden}
.topbar{flex-shrink:0;height:64px;background:var(--header);color:#fff;display:flex;align-items:center;gap:6px;padding-inline:max(12px,env(safe-area-inset-left,0px)) max(24px,env(safe-area-inset-right,0px))}
.topbar .logo-img{height:44px;width:auto;display:block;margin-left:clamp(0px,5vw,96px)}
.topbar .hamb{display:none;background:none;border:0;color:#fff;padding:6px;border-radius:6px}
.topbar .spacer{flex:1}
.top-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:#fff;padding:4px 12px;font-size:14px;line-height:1.1;border-radius:6px;white-space:nowrap}
.top-item:hover{background:rgba(255,255,255,.08)}
.top-item svg{opacity:.85}
.top-item .badge{position:absolute;top:-2px;left:calc(50% + 4px);min-width:18px;height:18px;border-radius:99px;background:#e8442c;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.top-item .me{display:flex;align-items:center;gap:6px}
@media (max-width:900px){.top-item.opt{display:none}}
@media (max-width:560px){.top-item .lab{display:none}.top-item{padding:6px 8px}.topbar .logo-img{height:36px}}
.layout{flex:1;min-height:0;display:flex;position:relative}
.sidebar{width:292px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.nav{padding:16px 12px;flex:1;display:flex;flex-direction:column;gap:6px}
.nav .grp-gap{height:6px}
.nav-item{width:100%;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 9px;border:1.5px solid transparent;border-radius:12px;background:color-mix(in srgb,var(--surface-2) 40%,var(--surface));color:var(--ink-2);font-size:14.5px;font-weight:600;text-align:left;transition:background .15s,border-color .15s;font-size:13.5px;gap:10px}
.nav-item:hover{background:var(--brand-wash)}
.nav-item .nav-ico{width:34px;height:34px;border-radius:9px;background:var(--brand-wash);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .chev{color:var(--ink-4);flex-shrink:0;display:flex}
.nav-item[aria-current="page"]{background:var(--brand-wash);border-color:var(--brand);color:var(--brand-strong)}
.nav-item[aria-current="page"] .nav-ico{background:var(--brand);color:var(--brand-ink)}
.nav-item[aria-current="page"] .chev{color:var(--brand-strong)}
.nav-badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;letter-spacing:.03em;flex-shrink:0}
.nav-badge.new{background:var(--brand-wash);color:var(--brand-strong)}
.nav-item:hover .nav-badge.new{background:var(--surface)}
.nav-badge.paid{background:color-mix(in srgb,var(--warn-wash) 55%,var(--surface));color:color-mix(in srgb,var(--warn) 70%,var(--ink-3));border:1px solid color-mix(in srgb,var(--warn-solid) 14%,transparent);text-transform:uppercase;letter-spacing:.04em}
.nav-badge.pct{background:var(--warn-wash);color:var(--warn);font-size:12.5px}
.scrim{display:none}
.att-card{display:flex;flex-direction:column}
.att-card-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.att-card-head h3{font-size:13.5px;font-weight:700;flex:1}
.att-toggle{width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;padding:12px 14px}
.att-toggle .chev{display:inline-flex;color:var(--ink-3);transition:transform .2s}
.att-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.att-toggle[aria-expanded="true"]{padding-bottom:8px}
.att-card-list{display:flex;flex-direction:column;padding:0 6px}
.nav-att-item{display:flex;align-items:flex-start;gap:9px;padding:8px;border-radius:8px;border:0;background:none;text-align:left;width:100%;color:var(--ink-2)}
.nav-att-item:hover{background:var(--surface-2)}
.nav-att-item .att-ico{width:26px;height:26px;border-radius:7px}
.nav-att-item .t{min-width:0;flex:1}
.nav-att-item .t b{display:block;font-size:12.5px;font-weight:600;line-height:1.3;color:var(--ink)}
.nav-att-item .t span{display:block;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-att-item .go{font-size:12px;font-weight:600;color:var(--brand-strong);white-space:nowrap;padding-top:1px}
.att-card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px 12px;border-top:1px solid var(--line);margin-top:4px}
.nav-att-more{border:0;background:none;padding:0;font-size:12px;font-weight:600;color:var(--brand-strong)}
.att-inline{display:none}
.content{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}

/* ---------- VMS header ---------- */
.vms-head{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 24px 0}
.vms-head-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vms-head h1{font-size:19px;font-weight:700;letter-spacing:-.2px}
.vms-head .grow{flex:1}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px 11px;font-size:14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand-strong);border-bottom-color:var(--brand)}
.tab .count{font-size:11px;background:var(--surface-3);color:var(--ink-2);padding:1px 7px;border-radius:99px;font-weight:700}
.tab[aria-selected="true"] .count{background:var(--brand-wash);color:var(--brand-strong)}
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.page{padding:20px 24px 48px;max-width:1320px;margin:0 auto}

/* ---------- buttons, pills, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;border:1px solid transparent;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;line-height:1.2;transition:background .15s,border-color .15s,color .15s}
.btn svg{flex-shrink:0}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-strong)}
.btn-secondary{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-secondary:hover{border-color:var(--brand);color:var(--brand-strong)}
.btn-ghost{background:none;color:var(--brand-strong);padding-inline:8px}
.btn-ghost:hover{background:var(--brand-wash)}
.btn-danger-ghost{background:none;color:var(--ink-3);padding-inline:8px}
.btn-danger-ghost:hover{background:var(--bad-wash);color:var(--bad)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:7px}
.btn-lg{padding:11px 18px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);flex-shrink:0}
.icon-btn:hover{border-color:var(--brand);color:var(--brand-strong)}
.icon-btn.plain{border-color:transparent;background:none}
.icon-btn.plain:hover{background:var(--surface-3)}
.icon-btn.dots{width:32px;color:var(--ink-2)}
.icon-btn.dots svg{stroke-width:3}
.pill{--pbg:var(--surface-3);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--pbg);color:var(--ink-2)}
.pill[data-tone="info"]{--pbg:var(--info-wash);color:var(--info)}
.pill[data-tone="brand"]{--pbg:var(--brand-wash);color:var(--brand-strong)}
.pill[data-tone="warn"]{--pbg:var(--warn-wash);color:var(--warn)}
.pill[data-tone="good"]{--pbg:var(--good-wash);color:var(--good)}
.pill[data-tone="bad"]{--pbg:var(--bad-wash);color:var(--bad)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
/* status pills: rounded on the left, colour fading out to the right */
.pill:has(> .dot){border-radius:99px 0 0 99px;padding:3px 26px 3px 9px;background:linear-gradient(90deg,var(--pbg) 0%,var(--pbg) 50%,transparent 100%)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:2px 7px;border-radius:6px;white-space:nowrap}
.tag svg{flex-shrink:0}
.tag.gst{color:var(--good);border-color:transparent;background:var(--good-wash)}
.tag.ts{color:var(--warn);border-color:transparent;background:var(--warn-wash)}
.tag.past{color:var(--navy);border-color:transparent;background:var(--navy-wash)}
.tag.outside{color:var(--ink-2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);padding:6px 13px;border-radius:99px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand-wash);border-color:var(--brand);color:var(--brand-strong);font-weight:600}
.chip .n{font-size:11px;font-weight:700;opacity:.8}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:0 12px;height:38px;min-width:0}
.search:focus-within{border-color:var(--brand)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%;font-size:13.5px}
.search svg{color:var(--ink-4);flex-shrink:0}
.select{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--ink-2);max-width:100%}

/* ---------- generic card + section ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-pad{padding:16px}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-head h2{font-size:15px;font-weight:700}
.section-head .hint{font-size:12.5px;color:var(--ink-3)}
.section-head .grow{flex:1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.stars{display:inline-flex;gap:1px;vertical-align:-2px}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink-3)}
.empty .ico{width:44px;height:44px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.empty b{color:var(--ink);font-size:15px}
.no-replies{display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--ink-3)}
.no-replies .ico{width:36px;height:36px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.no-replies b{color:var(--ink);font-size:15px}

/* ---------- requirements page ---------- */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.home-col{display:flex;flex-direction:column;gap:20px;min-width:0}
.hero-ask{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero-ask h2{font-size:17px;font-weight:700}
.hero-ask .row{display:flex;gap:10px;flex-wrap:wrap}
.hero-ask .search{flex:1 1 280px;height:44px}
.hero-ask .quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3)}
.hero-ask .quick button{border:0;background:var(--surface-2);color:var(--ink-2);padding:4px 10px;border-radius:99px;font-size:12.5px}
.hero-ask .quick button:hover{background:var(--brand-wash);color:var(--brand-strong)}

.attention{display:flex;flex-direction:column}
.att-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.att-item:first-of-type{border-top:0}
.att-item:hover{background:var(--surface-2)}
.att-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.att-ico[data-tone="info"]{background:var(--info-wash);color:var(--info)}
.att-ico[data-tone="warn"]{background:var(--warn-wash);color:var(--warn)}
.att-ico[data-tone="good"]{background:var(--good-wash);color:var(--good)}
.att-ico[data-tone="brand"]{background:var(--brand-wash);color:var(--brand-strong)}
.att-text{flex:1;min-width:0}
.att-text b{font-weight:600;display:block}
.att-text span{font-size:12.5px;color:var(--ink-3)}
.att-go{font-size:12.5px;font-weight:600;color:var(--brand-strong);white-space:nowrap}
.att-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.att-head h2{font-size:14.5px}
.att-head .grow{flex:1}

.list-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.list-tools .search{flex:1 1 220px;max-width:340px}
.search-full{display:flex;gap:8px;align-items:center}
.search-full.anim{animation:fade .15s ease}
.search-full .search{flex:1;height:46px;font-size:15px}
.fab-add{display:none}
.ai-find .spark{display:inline-flex;color:#d97706}
.card.empty.v-none{padding:22px 16px;gap:12px;font-size:13.5px;color:var(--ink-3)}
.btn-primary.ai-find .spark{color:#fde68a}
.ven-search{margin-bottom:12px}
.ven-search{position:relative}
.ven-search .clear-x{border:0;background:none;width:30px;height:30px;display:grid;place-items:center;color:var(--ink-3);border-radius:99px;flex-shrink:0;cursor:pointer}
.ven-search .clear-x:hover{background:var(--surface-2);color:var(--ink)}
.ven-search #add-vendor-btn{height:46px}
.ven-search+.search-hint{margin:-4px 0 12px}
.search-hint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:-4px}
.req-list{display:flex;flex-direction:column;gap:10px}
.req-card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.req-card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.req-card[data-closed="1"]{opacity:.7}
.req-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.req-top .when{font-size:12px;color:var(--ink-3)}

.pcard .pr{font-size:13px;font-weight:700;color:var(--ink)}
.pcard .w{font-size:12px;color:var(--ink-3)}

/* ---------- vendors ---------- */
.v-head{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,2fr) minmax(0,1fr) 200px;gap:14px;padding:0 16px 8px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.v-row{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,2fr) minmax(0,1fr) 200px;gap:14px;align-items:center;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;position:relative}
.v-row:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.v-row .who{display:flex;gap:10px;align-items:center;min-width:0}
.v-row .who b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-row .who span{font-size:12px;color:var(--ink-3)}
.v-row .cell{font-size:13px;min-width:0}
.v-row .cell .k{display:none}
.v-row .cell .s{font-size:12px;color:var(--ink-3)}
.v-row .acts{display:flex;gap:6px;justify-content:flex-end}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-cta{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px dashed var(--line-2);border-radius:12px;background:var(--surface);flex-wrap:wrap}
.upload-cta .ico{width:40px;height:40px;border-radius:10px;background:var(--brand-wash);color:var(--brand-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.upload-cta .tx{flex:1;min-width:200px}
.upload-cta .tx b{display:block}
.upload-cta .tx span{font-size:12.5px;color:var(--ink-3)}

/* ---------- templates ---------- */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tpl h3{font-size:14.5px}
.tpl .note{font-size:12.5px;color:var(--ink-3)}
.terms{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:12.5px;padding:10px 12px;background:var(--surface-2);border-radius:9px}
.terms dt{color:var(--ink-3)}
.terms dd{margin:0;font-weight:600}
.tpl .foot{display:flex;align-items:center;gap:8px;margin-top:auto}
.tpl .foot .grow{flex:1;font-size:12px;color:var(--ink-3)}
.tpl-new{border:1.5px dashed var(--line-2);border-radius:12px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-3);min-height:180px;font-weight:600}
.tpl-new:hover{border-color:var(--brand);color:var(--brand-strong)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:920px}
.m-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.m-head .t{flex:1;min-width:0}
.m-head h2{font-size:16px}
.m-head p{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.m-body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.m-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.m-foot .grow{flex:1;font-size:12.5px;color:var(--ink-3);min-width:160px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lab{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field label .opt{font-weight:400;color:var(--ink-4)}
.input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:13.5px;width:100%;min-width:0}
.input:focus{outline:0;border-color:var(--brand)}
textarea.input{resize:vertical;min-height:70px}
.inline{display:flex;gap:8px}
.inline .input{flex:1}
.addon{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.addon .lab{font-size:12.5px;font-weight:700}
.check{display:flex;align-items:flex-start;gap:9px;font-size:13px;cursor:pointer}
.check input{margin-top:2px;accent-color:var(--brand);width:16px;height:16px;flex-shrink:0}
.check span small{display:block;color:var(--ink-3);font-size:12px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;background:var(--brand-wash);border-radius:10px}
.total b{font-size:18px}
.rate-rows{display:flex;flex-direction:column;gap:4px}
.rate-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.rate-row .tx{flex:1}
.rate-row .tx b{display:block;font-size:13.5px}
.rate-row .tx span{font-size:12px;color:var(--ink-3)}
.star-btn{background:none;border:0;padding:2px;color:var(--star-off)}
.star-btn[data-on="1"]{color:var(--star)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;border:1.5px dashed var(--line-2);border-radius:12px;text-align:center;cursor:pointer;color:var(--ink-3)}
.drop:hover,.drop:focus-within{border-color:var(--brand);background:var(--brand-wash);color:var(--brand-strong)}
.drop b{color:var(--ink);font-size:14px}
.parsing{display:flex;align-items:center;gap:12px;padding:16px;border-radius:10px;background:var(--surface-2)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--brand);animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.extracted{font-size:12px;color:var(--good);font-weight:600;display:flex;gap:6px;align-items:center}
.cmp-wrap{overflow-x:auto}
.cmp{border-collapse:separate;border-spacing:0;width:100%;min-width:560px;font-size:13px}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{position:sticky;top:0;background:var(--surface);font-size:13.5px}
.cmp tbody th{color:var(--ink-3);font-weight:600;font-size:12.5px;white-space:nowrap;width:150px}
.cmp .best{color:var(--good);font-weight:700}
.stages-tbl{min-width:620px}
.stages-tbl thead th{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.stages-tbl td:first-child{width:190px;white-space:nowrap}
.cmp .col-hl{background:var(--brand-wash)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--surface);z-index:210;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slide .22s cubic-bezier(.2,.9,.3,1)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer .m-body{gap:18px}
.rating-bars{display:flex;flex-direction:column;gap:7px}
.rb{display:grid;grid-template-columns:110px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:12.5px}
.rb .b{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.rb .b i{display:block;height:100%;background:var(--star);border-radius:99px}
.file{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.file:first-child{border-top:0}
.file .fi{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.file .tx{flex:1;min-width:0}
.file .tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .tx span{font-size:12px;color:var(--ink-3)}
.trust{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;background:var(--surface-2)}
.trust .tx{flex:1;min-width:0}
.trust .tx b{display:block}
.trust .tx span{font-size:12px;color:var(--ink-3)}
.copy{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;user-select:all}
.notes-list{display:flex;flex-direction:column;gap:8px}
.note-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.note-item .n{width:24px;height:24px;border-radius:7px;background:var(--surface-3);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.note-item q{display:block;font-size:13px;font-weight:600;quotes:none}
.note-item p{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.rename{width:100%;border-collapse:collapse;font-size:12.5px}
.rename td{padding:6px 8px;border-bottom:1px solid var(--line)}
.rename td:first-child{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.rename td:last-child{font-weight:600}
.flash{animation:flash 1.8s ease 1}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}20%,70%{box-shadow:0 0 0 4px var(--warn)}}
.snack{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-size:13px;font-weight:500;z-index:400;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);animation:fade .2s}

/* ---------- More Sellers: curated seller flow (ported from feeds) ---------- */
.fade-in-l{animation:fade .4s ease-out both}
.cur-loader{position:relative;min-height:440px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,rgba(13,148,136,.05) 0%,var(--surface) 65%),var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px 64px}
.cl-chips{position:absolute;top:12px;left:16px;right:16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cl-chips span{flex-shrink:0;font-size:12px;font-weight:500;padding:4px 10px;border-radius:99px;background:#e2e8f0;color:#94a3b8}
.cl-body{display:flex;align-items:center;justify-content:center;gap:28px}
.cl-scene{width:320px;height:190px;max-width:100%;border-radius:16px;background:linear-gradient(135deg,#f8fafc,rgba(240,253,250,.5));border:1px solid #f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.cl-scene>div{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.cl-ring-row{display:flex;align-items:center;gap:16px}
.cl-ring{position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cl-ring>svg{position:absolute;inset:0;transform:rotate(-90deg)}
.cl-icon svg{display:block}
#cl-arc{transition:stroke-dashoffset .3s ease-out}
.cl-icon{position:relative;width:48px;height:48px;border-radius:50%;background:#fff;color:#0d9488;display:flex;align-items:center;justify-content:center;transition:all .3s}
.cl-icon.done{background:linear-gradient(135deg,#2dd4bf,#0d9488);color:#fff}
.cl-icon .pop{display:flex;animation:loader-check-pop .4s ease-out both}
.cl-label{font-size:16px;font-weight:600;color:var(--ink);width:250px}
.cl-time{position:absolute;bottom:22px;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:6px;background:#f0fdfa;border:1px solid #ccfbf1;border-radius:99px;padding:6px 16px;font-size:12px;font-weight:600;color:#0f766e;white-space:nowrap}
.lsc{position:relative}
.lsc-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;height:100%}
.l-card{position:absolute;width:82px;height:64px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.l-card i{display:block;height:6px;border-radius:99px;background:#f1f5f9}
.l-card.lit{border:2px solid #2dd4bf;background:rgba(240,253,250,.8);color:#14b8a6;animation:loader-card-lightup 3s ease-in-out infinite backwards;gap:0}
.l-sweep{position:absolute;inset:0;overflow:hidden;border-radius:8px}
.l-sweep div{animation:loader-scan-sweep 3s ease-in-out infinite}
.l-sweep div{position:absolute;top:0;bottom:0;width:96px;background:linear-gradient(90deg,transparent,rgba(153,246,228,.4),transparent)}
.l-mag{position:absolute;width:48px;height:48px;border-radius:50%;border:2px solid #14b8a6;animation:loader-mag-glass 3s ease-in-out infinite}
.l-mag span{position:absolute;bottom:-8px;right:-8px;width:16px;height:16px;border-radius:50%;background:#14b8a6}
.l-doc{position:absolute;left:12px;top:12px;width:100px;height:150px;border-radius:8px;border:1px solid #99f6e4;background:#fff;padding:10px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden}
.l-doc div{display:flex;align-items:center;gap:4px;color:#14b8a6}
.l-doc span{font-size:7px;font-weight:600;color:#334155;line-height:1.2}
.l-sup{position:absolute;right:12px;width:76px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;padding:8px;display:flex;align-items:center;gap:6px}
.l-sup .b{flex:1;display:flex;flex-direction:column;gap:4px}
.l-sup .b i{display:block;height:6px;width:100%;border-radius:99px;background:#f1f5f9}
.l-svg{position:absolute;inset:0;width:100%;height:100%}
.l-pop{position:absolute;width:24px;height:24px;border-radius:50%;background:#14b8a6;color:#fff;display:flex;align-items:center;justify-content:center;animation:loader-match-pop 2.5s ease-in-out infinite backwards}
.l-shieldwrap{position:relative;width:200px;height:100px;display:flex;align-items:center;justify-content:center}
.l-shield{position:relative;z-index:1}
.l-shield .rip{position:absolute;inset:0;border-radius:50%;background:rgba(204,251,241,.5);animation:loader-shield-ripple 2.5s ease-out infinite}
.l-shield .core{position:relative;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#2dd4bf,#0d9488);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 15px -3px rgba(20,184,166,.4)}
.l-docscan{position:absolute;left:16px;right:16px;top:0;height:100%;overflow:hidden;border-radius:99px}
.l-docscan div{position:absolute;left:0;right:0;top:0;height:32px;opacity:0;background:linear-gradient(180deg,transparent,rgba(94,234,212,.25),transparent);animation:loader-doc-scan 3s ease-in-out infinite}
.l-ticks{position:relative;height:28px;width:100%;display:flex;align-items:center;justify-content:center}
.l-ticks div{position:absolute;display:flex;align-items:center;gap:4px;border-radius:99px;background:#f0fdfa;border:1px solid #99f6e4;padding:2px 8px;color:#0d9488;animation:loader-trust-tick 4.2s ease-in-out infinite backwards}
.l-ticks b{font-size:10px;color:#0f766e}
.l-map{border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc;overflow:hidden}
.l-me{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px}
.l-me .dot{position:relative;width:36px;height:36px;border-radius:50%;background:#14b8a6;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.15);color:#fff;display:flex;align-items:center;justify-content:center}
.l-me .dot i{position:absolute;inset:-2px;border-radius:50%;border:2px solid #2dd4bf;animation:loader-pin-ripple 3s ease-out infinite}
.l-me b{font-size:9px;font-weight:600;color:#0f766e;background:rgba(255,255,255,.95);padding:2px 6px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05);white-space:nowrap}
.l-pin{position:absolute;animation:loader-pin-drop 3s ease-in-out infinite backwards}
.l-rank{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding-bottom:8px}
.l-rank .row{display:flex;align-items:center;gap:10px;animation:loader-rank-slide-in 2.5s ease-out infinite backwards}
.l-rank .medal{width:32px;height:32px;border-radius:8px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.l-rank .track{position:relative;flex:1;height:28px;border-radius:8px;background:#f1f5f9;overflow:hidden}
.l-rank .track>span{display:block;height:100%;border-radius:8px;transform-origin:left;animation:loader-bar-grow 2.5s ease-out infinite backwards}
.l-rank em{position:absolute;right:6px;top:50%;margin-top:-8px;color:#d97706;display:flex;animation:loader-trophy-bounce 1.5s ease-in-out infinite}
@keyframes loader-scan-sweep{0%,100%{transform:translateX(-40px)}50%{transform:translateX(250px)}}
@keyframes loader-card-lightup{0%,80%{opacity:0;transform:scale(.9)}10%,20%{opacity:1;transform:scale(1)}}
@keyframes loader-mag-glass{0%{left:15px;top:120px;opacity:0}25%{left:60px;top:60px;opacity:1}50%{left:145px;top:30px;opacity:1}75%{left:220px;top:90px;opacity:1}100%{left:250px;top:130px;opacity:0}}
@keyframes loader-line-flow{0%{stroke-dashoffset:14;opacity:.3}50%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-14;opacity:.3}}
@keyframes loader-match-pop{0%,40%{opacity:0;transform:scale(0)}50%,80%{opacity:1;transform:scale(1)}90%,100%{opacity:0;transform:scale(.8)}}
@keyframes loader-shield-ripple{0%{transform:scale(.8);opacity:.6}100%{transform:scale(2.5);opacity:0}}
@keyframes loader-doc-scan{0%{transform:translateY(-40px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(140px);opacity:0}}
@keyframes loader-trust-tick{0%,5%{opacity:0;transform:translateY(8px) scale(.8)}10%,25%{opacity:1;transform:translateY(0) scale(1)}30%,100%{opacity:0;transform:translateY(-8px) scale(.9)}}
@keyframes loader-pin-drop{0%{opacity:0;transform:translateY(-20px) scale(.5)}30%,70%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:.4;transform:translateY(0) scale(.9)}}
@keyframes loader-pin-ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
@keyframes loader-trophy-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes loader-rank-slide-in{0%{opacity:0;transform:translateX(-30px)}20%,80%{opacity:1;transform:translateX(0)}100%{opacity:.5;transform:translateX(0)}}
@keyframes loader-bar-grow{0%{transform:scaleX(0)}40%,80%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes loader-check-pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.cur-res{display:flex;flex-direction:column;gap:10px}
.cr-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent)}
.cr-chips span{flex-shrink:0;font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-3);background:var(--surface)}
.cr-chips span b{color:var(--ink);font-weight:600}
.cr-chips .q{border-color:#0d9488;color:#0f766e;background:#f0fdfa;font-weight:600}
.cr-toggle{display:inline-flex;align-self:flex-start;border-radius:99px;background:#f1f5f9;padding:2px;font-size:12px;font-weight:600}
.cr-toggle button{border:1px solid transparent;background:none;border-radius:99px;padding:6px 12px;color:#64748b}
.cr-toggle button:hover{color:#334155}
.cr-toggle button.on{border-color:#0d9488;background:#fff;color:#0f766e;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.cr-carousel{position:relative}
.cr-viewport{overflow:hidden;margin:-4px;padding:4px}
.cr-track{display:flex;gap:10px;transition:transform .45s cubic-bezier(.22,1,.36,1)}
.cr-track .frc{flex:0 0 calc((100% - 40px) / 5)}
@media (max-width:1180px){.cr-track .frc{flex-basis:calc((100% - 30px) / 4)}}
.cr-pager{display:flex;align-items:center;justify-content:center;gap:14px;font-size:12px;color:var(--ink-3)}
.cr-dots{display:flex;gap:6px}
.cr-dots button{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:var(--line-2);transition:width .25s,background .25s}
.cr-dots button.on{width:22px;background:#0d9488}
.cr-grid.mb{display:none}
.cr-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}

/* ---------- price analytics panel (from v1) ---------- */

/* ---------- IndiaMART Desktop Style Guide overrides ---------- */
body{font-size:14px;color:var(--ink-2);font-feature-settings:"cv11","ss01"}
h1,h2,h3{color:var(--ink)}
.ad h3{color:#fff}
/* type scale: hero 18 · headings 16 · body 14 · sub 13 · caption 12 · small 10 */
.vms-head h1,.d-head h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.section-head h2,.sc-name,.req-card h3,.side-card h3,.tpl h3,.m-head h2{font-size:16px;font-weight:600}
.section-head .hint,.req-specs,.sub-line,.sc-loc,.sc-prod{font-size:13px}
.sc-stats,.when,.req-top .when,.title-meta .muted{font-size:12px}
.sc-price b{font-size:16px;font-weight:700}
.s-price b{font-size:16px}
/* buttons: 8px radius · large 48/16 · medium 42/14 · small 40/13 */
.btn{min-height:42px;padding:0 16px;font-size:14px;font-weight:600;border-radius:8px;gap:8px;border-width:1.5px}
.btn-sm{min-height:40px;padding:0 14px;font-size:13px;border-radius:8px}
.btn-lg{min-height:48px;padding:0 20px;font-size:16px}
.btn-primary{background:var(--brand);border-color:var(--brand)}
.btn-primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn-primary:active{background:var(--brand-active)}
.btn-primary[disabled]{background:var(--brand-disabled);border-color:var(--brand-disabled);opacity:1}
.btn-indigo{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-indigo:hover{background:var(--navy-hover);border-color:var(--navy-hover)}
.btn-secondary{background:var(--surface);border-color:var(--brand);color:var(--brand)}
.btn-secondary:hover{background:var(--brand-wash);border-color:var(--brand-strong);color:var(--brand-strong)}
.btn-ghost{color:var(--brand);padding-inline:10px}
.btn-ghost:hover{background:var(--brand-wash);color:var(--brand-strong)}
.btn-danger-ghost{color:var(--ink-2)}
.icon-btn{width:40px;height:40px;border-radius:8px;border-color:var(--line-2)}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
#post-btn,.head-actions .btn{min-height:40px}
/* chips & selects sit beside 40px controls */
.chip{min-height:36px;padding:0 14px;border-color:var(--line-2);color:var(--ink-2)}
.chip.sm{min-height:36px;padding:0 12px}
.chip[aria-pressed="true"]{background:var(--brand-wash);border-color:var(--brand);color:var(--brand-strong)}
.sf-sort select,.select{min-height:36px;border-radius:8px;border-color:var(--line-2);padding:0 10px}
/* inputs: 44px, neutral-300 border, teal focus ring */
.input{min-height:44px;padding:10px 14px;font-size:14px;border:1px solid var(--line-2);border-radius:8px;color:var(--ink)}
textarea.input{min-height:96px}
.input::placeholder{color:var(--ink-4)}
.input:hover{border-color:var(--ink-4)}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.field label,.field .lab{font-size:13px;font-weight:500;color:var(--ink-2)}
.search{height:44px;border-radius:8px;border-color:var(--line-2)}
/* cards & containers: 12px radius, white, 16px padding, depth 1 / 2 / 3 */
.card,.seller,.side-card,.req-card,.fcard,.tpl,.v-row,.pcard,.att-card,.upload-cta{border-radius:12px;border-color:var(--line)}
.seller,.side-card{padding:16px}
.req-card{padding:16px}
.req-card:hover,.v-row:hover,.seller:hover{box-shadow:var(--shadow-2)}
.seller.short{box-shadow:var(--shadow)}
.modal,.drawer,.menu{box-shadow:var(--shadow-lg)}
.modal{border-radius:12px}
/* 8pt spacing */
.page{padding:24px 24px 48px}
.d-main{gap:24px}
.section{gap:16px}
.req-list{gap:16px}
.d-grid{gap:24px}
.home-grid{gap:24px}
.sc-foot{padding-top:16px}
/* semantic */
.pill[data-tone="warn"]{color:var(--warn)}
.due{color:var(--warn)}
.ms-bar i[data-s="done"],.ms-bar i[data-s="now"]{background:var(--brand)}
.next{background:var(--brand-wash);border-radius:12px;padding:16px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--warn-solid)}
.tab{font-size:14px;font-weight:600}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.seg button[aria-selected="true"]{color:var(--brand)}

/* Price Analytics: search-first hero + "Showing prices for" */
.pa-hero{background:linear-gradient(135deg,var(--brand-wash),color-mix(in srgb,var(--navy-wash) 70%,var(--surface)));border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--card-shadow)}
.pa-hero-t{display:flex;gap:12px;align-items:center}
.pa-hero-t h2{font-size:18px;font-weight:700;color:var(--ink)}
.pa-hero-t p{font-size:13px;color:var(--ink-3);margin-top:2px}
.pa-rs.lg{width:44px;height:44px}
.pa-rs.lg svg{width:22px;height:22px}
.pa-hero .pa-sbox{display:flex;gap:8px;max-width:none;flex:none;position:relative}
.pa-hero .pa-sbox .search{flex:1;height:48px;background:var(--surface)}
.pa-hero .pa-sbox .btn{min-height:48px}
.pa-quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3)}
.pa-quick button{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.pa-quick button:hover{border-color:var(--brand);color:var(--brand-strong)}
.pa-ctx{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pa-ctx .lb{font-size:13px;color:var(--ink-3);flex-shrink:0}
.pa-ctx .sel{position:relative;flex:0 1 420px;min-width:0;display:flex;align-items:center}
.pa-ctx select{appearance:none;-webkit-appearance:none;width:100%;font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:10px 34px 10px 12px;min-height:44px;text-overflow:ellipsis;box-shadow:var(--shadow)}
.pa-ctx .sel svg{position:absolute;right:10px;pointer-events:none;color:var(--ink-3)}
.pa-ctx .grow{flex:1}
.pa-auto{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--brand-strong);background:var(--brand-wash);border-radius:99px;padding:3px 10px}
@media (max-width:720px){

  .pa-hero .pa-sbox .btn{padding:0 14px}
  .pa-ctx .sel{flex:1 1 100%}
}

body.v-prices .vms-head-row{display:none}

.qc-hd{display:flex;align-items:center;gap:10px;margin:0 -16px;padding:14px 16px 12px;background:linear-gradient(135deg,var(--brand-wash),color-mix(in srgb,var(--navy-wash) 60%,var(--surface)));border-bottom:1px solid var(--line)}

/* know before you negotiate */
.pa-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pa-tile{border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;min-width:0}

.pa-tile[data-t="good"] .ti{background:var(--good-wash);color:var(--good)}
.pa-tile[data-t="info"] .ti{background:var(--info-wash);color:var(--info)}
.pa-tile[data-t="warn"] .ti{background:var(--warn-wash);color:var(--warn)}

.pa-tile .tk{font-size:12px;color:var(--ink-3);font-weight:600}
.pa-tile .tv{font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.pa-tile .th{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.pa-spread{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pa-spread .sh{display:flex;justify-content:space-between;font-size:13px}

.pa-city.base .nm{color:var(--ink)}
/* v7: no band taps; subtle quote widget; India map */
.pa-box.qc{border:1px solid var(--line);background:var(--surface);box-shadow:var(--card-shadow)}
.qc-hd2{display:flex;gap:10px;align-items:center}

.pa-rs.sm{width:30px;height:30px}

/* dev view */
.pa-hero{position:relative}
.pa-dbg-tog{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;height:30px;min-width:30px;padding:0 7px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);font:inherit;font-size:12px;font-weight:700;cursor:pointer;z-index:3}
.pa-dbg-tog:hover{color:var(--navy);border-color:var(--navy)}
.pa-dbg-tog.on{background:var(--navy);border-color:var(--navy);color:#fff;padding:0 10px 0 8px}
.pa-dbg-tog span:empty{display:none}
.pa-dbg-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--navy-wash);color:var(--navy);font-size:13px}
.pa-dbg-bar span{flex:1}
.pa-dbg-bar i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:800}
.pa-dbg-bar button{border:1px solid var(--navy);background:var(--surface);color:var(--navy);border-radius:7px;padding:4px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.pa-debug .pa-box,.pa-debug .pa-hero,.pa-debug .pa-ctx{outline:1.5px dashed color-mix(in srgb,var(--navy) 45%,transparent);outline-offset:3px;position:relative}
.pa-dbg{position:absolute;top:8px;right:8px;z-index:4;width:26px;height:26px;border-radius:50%;border:0;background:var(--navy);color:#fff;font:700 13px/1 Georgia,serif;font-style:italic;cursor:pointer;box-shadow:0 2px 8px rgba(46,49,146,.35);animation:pa-in .25s ease}
.pa-dbg:hover{transform:scale(1.08)}
.pa-hero .pa-dbg{right:auto;left:-10px;top:-10px}
.pa-ctx .pa-dbg{top:-12px;right:-6px}
.pa-debug .pa-hero .pa-dbg-tog{right:12px}
.pa-dbg-doc{display:flex;flex-direction:column;gap:16px;font-size:13px;color:var(--ink-2)}
.pa-dbg-doc section{display:flex;flex-direction:column;gap:6px}
.pa-dbg-doc .ep{display:flex;align-items:center;gap:8px}
.pa-dbg-doc .ep b{font-family:var(--mono);font-size:14px;color:var(--ink)}
.pa-dbg-doc .m{font-family:var(--mono);font-size:10.5px;font-weight:800;background:var(--good-wash);color:var(--good);padding:2px 6px;border-radius:4px}
.pa-dbg-doc .m.none{background:var(--surface-3);color:var(--ink-3)}
.pa-dbg-doc .url{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);word-break:break-all}
.pa-dbg-doc .lb{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.pa-dbg-doc pre{margin:0;background:#0f172a;color:#d1e9e8;border-radius:8px;padding:10px 12px;font:12px/1.5 var(--mono);overflow-x:auto}
.pa-dbg-doc table{width:100%;border-collapse:collapse;font-size:12.5px}
.pa-dbg-doc td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.pa-dbg-doc td:last-child{text-align:right;font-weight:600;color:var(--ink);padding-left:10px}
.pa-dbg-doc code{font-family:var(--mono);font-size:11.5px;color:var(--navy);background:var(--navy-wash);padding:1px 5px;border-radius:4px;word-break:break-all}
.pa-dbg-doc ul{margin:0;padding-left:18px;display:grid;gap:5px}

.pa-dbg-doc .nt{font-size:12px;color:var(--ink-3);margin:0}
.pa-city.base .ci.map{width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.pa-hero-t{padding-right:36px}

/* Overview: Check Market Price, quiet version */
.ov section.ov-pa{animation:none!important;border:1px solid transparent!important;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,color-mix(in srgb,#1d8480 55%,var(--line)),color-mix(in srgb,#2e3192 45%,var(--line))) border-box!important;box-shadow:var(--card-shadow)!important;padding:14px 16px 14px!important}

/* upsell hook */
.pa-hook{display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 10px;width:100%;margin:8px 0 4px;padding:12px 14px;border:0;border-radius:10px;text-align:left;font:inherit;cursor:pointer;background:linear-gradient(135deg,var(--warn-wash),color-mix(in srgb,var(--warn-wash) 40%,var(--surface)));position:relative;overflow:hidden}

.pa-hook .hk-k{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--warn);letter-spacing:.02em}

.pa-hook .hk-s{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);line-height:1.35}

.ov-pa.v3 .pa-w-list{padding:0}
.ov-pa.v3 .pa-w-search{margin:8px 0 0;width:100%;gap:10px;padding:0 12px 0 8px;height:46px}
.ov-pa.v3 .pa-w-search .pa-rs.sm{width:30px;height:30px}
@container (max-width:330px){
  .pa-w-art{display:none}
  .ov-pa.v3 .pa-w-row .pa-chk{padding:0;width:30px;height:30px;justify-content:center;border-radius:50%}
  .ov-pa.v3 .pa-w-row .pa-chk .t{display:none}
  .ov-pa.v3 .pa-w-row .nm{white-space:normal;font-size:13.5px;line-height:1.3}
  .ov-pa.v3 .pa-w-search{font-size:13px}
}
.pa-w-search .pa-rs{flex:0 0 30px!important}
.pa-w-search span:not(.pa-rs){flex:1}
.pa-w-art{width:84px;height:52px}
.pa-w-top p{font-size:12px}
.pa-w-feat2{gap:3px 9px}
.pa-w-feat2 span{font-size:11px}
.pa-w-tab{background:none;color:color-mix(in srgb,var(--warn) 75%,var(--ink-3));font-size:10px;font-weight:700;letter-spacing:.06em;padding:8px 12px 0 0;border-radius:0;opacity:.85}
/* premium marker: visible differentiator, still light */
.pa-w-tab{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 7px!important;border-radius:99px!important;background:linear-gradient(135deg,#fdf1dc,#f8e2b8)!important;border:1px solid #efd29a;color:#9a6205!important;font-size:10.5px!important;font-weight:800;letter-spacing:.04em;opacity:1!important}
.pa-w-tab svg{color:#d99a20;fill:#d99a20}
.pa-w-top .pa-w-t{padding-right:86px}
/* variants */
.pa-variant{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);margin:6px 2px -14px;display:flex;align-items:center;gap:8px}
.pa-variant::after{content:'';flex:1;height:1px;background:var(--line)}
.pa-w-empty{display:flex;gap:10px;align-items:flex-start;padding:12px 0 4px}
.pa-w-empty .ei{width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--ink-3);display:grid;place-items:center;flex-shrink:0}
.pa-w-empty b{display:block;font-size:14px;color:var(--ink)}
.pa-w-empty span{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.pa-w-link{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;font:inherit;font-size:13px;font-weight:700;color:var(--brand-strong);cursor:pointer}
.pa-w-link.c{align-self:center;justify-content:center;width:100%;margin-top:12px}
.ov-pa.v3 .pa-w-body{display:flex;flex-direction:column}
.pa-w-row.locked .nm{color:var(--ink-3)}
.pa-lockic{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink-4);flex-shrink:0}
.pa-w-up{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.pa-w-up .btn{flex:1 1 auto;min-height:44px}
.ov-pa.is-free .pa-w-top{background:linear-gradient(135deg,color-mix(in srgb,var(--warn-wash) 60%,var(--surface)),color-mix(in srgb,var(--navy-wash) 60%,var(--surface)))}
@container (max-width:330px){
  .pa-w-top{flex-direction:column;align-items:flex-start;gap:6px}
  .pa-w-tab{position:static!important}
  .pa-w-top .pa-w-t{padding-right:0}
  .pa-w-top h2{white-space:normal}
}

/* --- v4: premium labels, solo (no requirements) widget, quieter free wall --- */
.pa-paid{display:inline-flex;align-items:center;gap:3px;padding:2px 7px 2px 5px;border-radius:99px;background:linear-gradient(135deg,#fdf1dc,#f8e2b8);border:1px solid #efd29a;color:#9a6205;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.pa-paid svg{color:#d99a20;fill:#d99a20}
.ov-pa.is-solo .pa-w-top{padding-bottom:16px}
.ov-pa.is-solo .pa-w-search{margin:14px 0 0;width:100%;border-color:color-mix(in srgb,var(--brand) 35%,transparent);box-shadow:0 1px 2px rgb(0 0 0/.04)}
.pa-wall{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;gap:12px;position:relative}
.pa-wall .tx{flex:1 1 260px;position:relative}
.pa-wall .pa-w-tab{position:static!important;margin-bottom:6px}
.pa-wall h2{font-size:15px;font-weight:700;margin:0}
.pa-wall p{font-size:12.5px;color:var(--ink-3);margin:3px 0 0;line-height:1.45}
.pa-wall .btn{flex:0 0 auto;min-height:40px}
@media (max-width:560px){.pa-wall .btn{width:100%}}
@container (max-width:330px){.ov-pa.is-solo .pa-w-search{font-size:13px;height:44px}.ov-pa.is-solo .pa-w-search span:not(.pa-rs){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
.ov-pa.is-solo .pa-w-top{flex-wrap:wrap}
.ov-pa.is-solo .pa-w-top .pa-w-search{flex:1 0 100%;min-width:0;margin:6px 0 0}
.pa-w-search i{font-style:normal}.pa-w-search i.sh{display:none}
@container (max-width:330px){.pa-w-search i.lg{display:none}.pa-w-search i.sh{display:inline}}
/* --- v5: faded premium pill --- */
.pa-w-tab,.pa-paid{background:color-mix(in srgb,var(--warn-wash) 55%,var(--surface))!important;border:1px solid color-mix(in srgb,var(--warn-solid) 14%,transparent)!important;color:color-mix(in srgb,var(--warn) 70%,var(--ink-3))!important;font-weight:700!important;box-shadow:none!important}
.pa-w-tab svg,.pa-paid svg{fill:none!important;color:color-mix(in srgb,var(--warn) 65%,var(--ink-4))!important}
</style>
</head>

const TODAY = '16 Oct';
// "Today" / "Yesterday" / dd/mm/yy from the prototype's short dates ("12 Oct", "Today, 9:40 AM", "Yesterday")
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function shortDate(str) {
  if (!str) return '';
  if (/^today/i.test(str)) return 'Today';
  if (/^yesterday/i.test(str)) return 'Yesterday';
  const m = /^(\d{1,2}) ([A-Za-z]{3})/.exec(str);
  if (!m) return str;
  const mi = MONTHS.indexOf(m[2]);
  if (mi < 0) return str;
  const d = new Date(2026, mi, +m[1]), t = new Date(2026, 9, 16);
  const diff = Math.round((t - d) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return `${String(d.getDate()).padStart(2, '0')}/${String(mi + 1).padStart(2, '0')}/26`;
}

/* Haptics synced to the rocket: soft ticks when it starts, getting stronger and closer together,
   peaking with one long buzz at lift-off (2100 ms). Vibration API has no strength control, so

  if (!navigator.vibrate) return;
  const pat = []; let t = 0, i = 0;

  pat[pat.length - 1] = Math.max(10, 2100 - (t - pat[pat.length - 1]));

}

  return `<span class="logo" style="background:${colorFor(id)};width:${size}px;height:${size}px;font-size:${Math.round(size * 0.34)}px">${initials(S[id].name)}</span>`;
}
function trustTags(id, extra = '') {
  const s = S[id];
  if (s.imProfile === false) return `<span class="tag outside icon-only" title="Added by you" aria-label="Added by you">${ic('userplus', 13)}</span>${extra}`;
  // Same look as the requirement seller cards: icon + word, no pills
  return `${s.gst ? `<span class="tl">${GST_ICON}GST</span>` : ''}${s.ts ? `<span class="tl">${TS_ICON}TrustSEAL</span>` : ''}${payProtected(id) ? `<span class="tl pp">${ic('shield', 14)}Payment protected</span>` : ''}${extra}`;
}
// Detail-page seller trust line: icon + word, no pills
const GST_ICON = '<svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="6" fill="#0a8a5c"/><path d="M3.2 6.1 5.1 8l3.8-3.9" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TS_ICON = '<svg width="15" height="14" viewBox="0 0 14 13" aria-hidden="true"><rect y="11" width="14" height="2" fill="#F0C92C"/><circle cx="7" cy="6" r="6" fill="#F0C92C"/><polyline points="4 5.7 5.7 8.3 10 4" fill="none" stroke="#E53E3E" stroke-width="1.3" stroke-linecap="round"/></svg>';
const payProtected = (id) => S[id].imProfile !== false && !!S[id].ts;
function trustLine(id) {
  const s = S[id];
  if (s.imProfile === false) return `<div class="trust-line"><span class="tag outside icon-only" title="Added by you" aria-label="Added by you">${ic('userplus', 13)}</span></div>`;
  const items = [s.gst && `<span>${GST_ICON}GST</span>`, s.ts && `<span>${TS_ICON}TrustSEAL</span>`, payProtected(id) && `<span class="pp">${ic('shield', 14)}Payment protected</span>`].filter(Boolean);
  return items.length ? `<div class="trust-line">${items.join('')}</div>` : '';

const pastTag = (id) => vrel(id).orders.length ? `<span class="tag past">${ic('repeat', 11)} You ordered before</span>` : '';
const nearTag = (id) => S[id].near ? `<span class="tag">${ic('pin', 11)} Near you</span>` : '';

function renderNav() {
  // Order and grouping follow the buyer dashboard left nav. Vendor Manager sits
  // in the Messages group since this prototype is that page.
  const groups = [
    [['grid', 'Dashboard'], ['user', 'My Profile', '47%', 'pct']],
    [['crown', 'Verified Business Buyer'], ['shield', 'Seller Verification', 'NEW', 'new'], ['badge', 'Payment Safety', 'NEW', 'new']],
    [['chat', 'Messages'], ['building', 'Vendor Manager', '', '', state.view !== 'prices'], ['trend', 'Price Analytics', 'Premium', 'paid', state.view === 'prices', 'prices']],
    [['rupee', 'Loans'], ['truck', 'Ship With IM'], ['gauge', 'Credit Score']],
  ];
  document.getElementById('nav').innerHTML = groups.map((g) => g.map(([i, l, b, bt, on, v]) => `<button class="nav-item" data-act="nav" ${v ? `data-v="${v}"` : ''} ${on ? 'aria-current="page"' : ''}>
      <span class="nav-ico">${ic(i, 19, 1.8)}</span><span class="lbl">${l}</span>${b ? `<span class="nav-badge ${bt}">${b}</span>` : ''}<span class="chev">${ic('right', 16)}</span></button>`).join('')).join('<span class="grp-gap" aria-hidden="true"></span>');
}
function renderTabs() {
  const active = REQS.filter((r) => !['received', 'closed'].includes(stageOf(r))).length;
  const tabs = [['overview', 'Overview'], ['requirements', 'My Requirements'], ['vendors', 'My Vendors'], ['docs', 'My Docs'], ['prices', 'Price Analytics']];
  document.getElementById('tabbar').innerHTML = tabs.map(([id, l, n]) => `<button class="tab" role="tab" aria-selected="${state.view === id}" data-act="tab" data-v="${id}" id="tab-${id}">${l}${id === 'prices' ? `<span class="pa-paid">${ic('star', 10, 2.4)} Premium</span>` : ''}${n != null ? `<span class="count">${n}</span>` : ''}</button>`).join('');
  document.getElementById('post-btn').innerHTML = `${ic('plus', 15, 2.5)} <span class="pb-l">Post RFQ</span><span class="pb-s">Post RFQ</span>`;
  // Mobile: the same four views live in a bottom nav bar
  const bn = [['overview', 'Overview', 'home'], ['requirements', 'Requirements', 'clipboard'], ['vendors', 'My Vendors', 'users'], ['docs', 'My Docs', 'file']];
  const hb = document.getElementById('pa-hbtn'); if (hb) hb.setAttribute('aria-current', state.view === 'prices' ? 'page' : 'false');
  document.getElementById('bottom-nav').innerHTML = bn.map(([id, l, icon]) => `<button class="bn-item" data-act="tab" data-v="${id}" aria-current="${state.view === id ? 'page' : 'false'}">${ic(icon, 21)}<span>${l}</span></button>`).join('');
}

/* ---------- Needs your attention (right rail; above the list when the rail drops below) ---------- */
function attentionBlock(where) {
  const att = attention();
  if (!att.length) return '';
  const mob = isMobile() && where === 'att-inline';
  if (mob) {
    const a0 = att[0];
    return `<button class="att-banner" data-act="att-sheet" aria-haspopup="dialog">
      <span class="ab-ico">${ic('bell', 18)}<i>${att.length}</i></span>
      <span class="ab-tx"><b>${att.length} thing${att.length > 1 ? 's' : ''} need${att.length > 1 ? '' : 's'} your attention</b><span>${esc(a0.title)}${att.length > 1 ? ` + ${att.length - 1} more` : ''}</span></span>
      <span class="ab-go">${ic('right', 18)}</span></button>`;
  }
  const open = !mob || state.attOpen;
  const lim = mob ? 99 : 5;
  const items = att.slice(0, state.attAll ? 99 : lim).map((a) => `<button class="nav-att-item" data-act="${a.act || 'open-req'}" data-req="${a.req}" ${a.seller ? `data-seller="${a.seller}"` : ''}>
      <span class="att-ico" data-tone="${a.tone}">${ic(a.icon, 13)}</span>
      <span class="t"><b>${esc(a.title)}</b><span>${esc(a.sub)}</span></span><span class="go">${a.go}</span></button>`).join('');
  const head = `${ic('bell', 15)}<h3>Needs your attention</h3><span class="pill" data-tone="info">${att.length}</span>`;
  return `<section class="card att-card ${where} ${mob ? 'acc' : ''}" ${where === 'att-rail' ? 'id="attention"' : ''}>
    ${mob ? `<button class="att-card-head att-toggle" data-act="att-toggle" aria-expanded="${!!open}">${head}<span class="chev">${ic('down', 16)}</span></button>` : `<div class="att-card-head">${head}</div>`}
    ${open ? `<div class="att-card-list">${items}</div>
    ${!mob && att.length > lim ? `<div class="att-card-foot"><button class="nav-att-more" data-act="att-all">${state.attAll ? 'Show fewer' : `Show all ${att.length}`}</button></div>` : '<div style="height:8px"></div>'}` : ''}
  </section>`;
}

/* ---------- Overview (suggestion, adapted from VMS_New) ---------- */
function ovDay(w) {
  if (!w) return 99;
  if (/^(today|just now)/i.test(w) || /ago/i.test(w)) return 0;
  if (/^yesterday/i.test(w)) return 1;
  const m = /^(\d{1,2}) ([A-Za-z]{3})/.exec(w); if (!m) return 99;
  const mi = MONTHS.indexOf(m[2]); return mi < 0 ? 99 : Math.round((new Date(2026, 9, 16) - new Date(2026, mi, +m[1])) / 864e5);
}
// Overview: latest requirement as a card; "See all" lists every requirement under it
function ovLatest() {
  const all = REQS.slice().sort((a, b) => (a.closed ? 1 : 0) - (b.closed ? 1 : 0) || (a.ts ?? -1) - (b.ts ?? -1));
  const r = all.find((x) => !x.closed) || all[0];
  if (!r) return '<p class="muted ov-empty">No requirements yet.</p>';
  const c = reqCta(r);
  const vis = r.sellers.filter((x) => x.status !== 'rejected').length;
  const card = `<div class="ov-latest">
    <div class="ol-top"><b class="ol-title">${esc(r.title)}</b><span class="ol-date">${shortDate(r.posted)}</span></div>
    <span class="ol-sub">${qtyText(r)} · ${vis ? `${vis} seller${vis > 1 ? 's' : ''}` : 'No replies yet'}</span>
    <button class="btn btn-primary ol-cta" data-act="${c.act}" data-req="${r.id}" ${c.seller ? `data-seller="${c.seller}"` : ''}>${esc(c.label)} ${ic('right', 14)}</button>
  </div>`;
  if (!state.ovReqAll) return card;
  return card + `<div class="ov-list ov-more">${all.filter((x) => x !== r).map((x) => { const cx = reqCta(x); return `<button class="ov-req" data-act="open-req" data-req="${x.id}">
      <span class="tx"><b>${esc(x.title)}</b><span class="ov-req-sub">${qtyText(x)} · ${shortDate(x.posted)}</span></span>
      <span class="nx">${esc(cx.label)} ${ic('right', 14)}</span></button>`; }).join('')}</div>`;
}
function ovFeed() {
  const out = [];
  REQS.forEach((r) => {
    out.push({ icon: 'list', tone: 'brand', title: `You posted “${r.title}”`, sub: qtyText(r), when: r.posted });
    r.sellers.forEach((x) => {
      if (!x.act) return; const n = S[x.id].name;
      const map = { quote: ['file', 'info', `${n} sent a quote`], call: ['phone', 'info', `${n} tried calling you`], message: ['chat', 'info', `${n} messaged you`], info: ['send', 'good', `${n} ${x.act.text.charAt(0).toLowerCase()}${x.act.text.slice(1)}`], sent: ['send', 'brand', `You asked ${n} for a quote`] }[x.act.type];
      if (map) out.push({ icon: map[0], tone: map[1], title: map[2], sub: r.title, when: x.act.when });
    });
    if (r.po) out.push({ icon: 'send', tone: 'good', title: `PO ${r.po.no} sent to ${S[r.po.seller].name}`, sub: r.title, when: r.po.sent });
  });
  return out.map((e) => ({ ...e, day: ovDay(e.when) })).sort((a, b) => a.day - b.day);
}
function renderOverview() {
  const open = REQS.filter((r) => !['received', 'closed'].includes(stageOf(r)));
  const toReview = open.reduce((n, r) => n + r.sellers.filter((x) => x.status === 'new' && x.quote).length, 0);
  const reviewReqs = open.filter((r) => r.sellers.some((x) => x.status === 'new' && x.quote));
  const unread = open.reduce((n, r) => n + r.sellers.filter((x) => x.unread && x.status !== 'rejected').length, 0);
  const ordered = REQS.filter((r) => stageOf(r) === 'ordered');
  const att = attention(), lim = state.ovAttAll ? 99 : 3;
  const stages = ['finding', 'review', 'shortlist', 'ordered', 'received'];
  const stageCol = { finding: 'var(--ink-4)', review: 'var(--info)', shortlist: 'var(--brand)', ordered: 'var(--warn-solid)', received: 'var(--good)' };
  const cnt = Object.fromEntries(stages.map((st) => [st, REQS.filter((r) => stageOf(r) === st).length]));
  const tot = Math.max(1, stages.reduce((n, st) => n + cnt[st], 0));
  const vend = myVendorIds().map((id) => ({ id, rt: avgRating(vrel(id).rating), n: REQS.filter((r) => r.sellers.some((x) => x.id === id && x.status !== 'rejected')).length + vrel(id).orders.length }))
    .sort((a, b) => b.n - a.n || (b.rt || 0) - (a.rt || 0)).slice(0, 3);
  const head = (t, btn) => `<div class="ov-h"><h2>${t}</h2>${btn || ''}</div>`;
  // Requirements a buyer can pick from (same list as the Requirements tab, latest first; closed ones left out)
  const pickable = REQS.filter((r) => !r.closed).sort((a, b) => (a.ts ?? -1) - (b.ts ?? -1));
  const latestReq = pickable[0];
  const best = latestReq ? bestFor(latestReq) : [];
  const recos = latestReq ? recosFor(latestReq) : [];
  const forLine = latestReq ? `<div class="ov-pick one"><span class="lb">For</span><b>${esc(latestReq.title)}</b></div>` : '';
  return `<div class="page"><div class="ov">
    <div class="ov-grid">
      <div class="ov-col ov-main">
        <section data-o="1" id="ov-reqs">${head('Latest requirement', REQS.length > 1 ? `<button class="ov-link" data-act="tab" data-v="requirements">See all ${REQS.length}</button>` : '')}
          ${latestReq ? `<div class="req-list ov-reqcard">${renderReqCard(latestReq)}</div>` : '<p class="muted ov-empty">No requirements yet.</p>'}
        </section>
    ${latestReq ? `<section class="ov-rec" data-o="3">${head('Best match')}${forLine}
      ${best.length ? `<div class="rec-row">${best.map((id, i) => recCard({ id, tint: i % 4, req: latestReq.id, img: REC_IMGS[i % REC_IMGS.length] })).join('')}</div>` : '<p class="muted ov-empty">No matching sellers yet.</p>'}</section>` : ''}
    ${recos.length ? `<section class="ov-rec" data-o="4">${head('Recommended products')}${forLine}
      <div class="rec-row">${recos.map((x) => recCard(x)).join('')}</div></section>` : ''}
      </div>
      <div class="ov-col ov-side">
        <section id="ov-att" data-o="2">${head('Needs your attention', att.length > 3 ? `<button class="ov-link" data-act="ov-attall">${state.ovAttAll ? 'Show less' : `See all ${att.length}`}</button>` : '')}
          ${att.length ? `<div class="ov-list">${att.slice(0, lim).map((a) => `<button class="ov-row" data-act="${a.act || 'open-req'}" data-req="${a.req}" ${a.seller ? `data-seller="${a.seller}"` : ''}>
            <span class="att-ico" data-tone="${a.tone}">${ic(a.icon, 14)}</span><span class="tx"><b>${esc(a.title)}</b><span>${esc(a.sub)}</span></span><span class="go">${a.go}</span></button>`).join('')}</div>`
            : `<p class="muted ov-empty">You are all caught up.</p>`}
        </section>
        ${ovPa()}
      </div>
    </div>
  </div></div>`;
}

// Recommended products for a requirement: the same item from top sellers first, then items often bought with it
function recosFor(r) {
  const sellers = [...r.sellers.filter((x) => x.status !== 'rejected').map((x) => x.id), ...moreSellers(r)].filter((v, i, a) => a.indexOf(v) === i && S[v].imProfile !== false);
  const keyOf = (id) => S[id].price && (S[id].price[r.key] ? r.key : Object.keys(S[id].price).find((k) => k.includes(r.key) || r.key.includes(k)));
  const same = sellers.map((id) => ({ id, k: keyOf(id) })).filter((x) => x.k).slice(0, 3).map((x, i) => ({ id: x.id, tint: i % 4, pname: titleCase(x.k), price: S[x.id].price[x.k] }));
  const pool = sellers.length ? sellers : Object.keys(S).filter((id) => S[id].imProfile !== false && S[id].ts);
  const extra = SUGG_PRODUCTS.map((pr, i) => ({ id: pool[(i + same.length) % pool.length], tint: pr.tint, pname: pr.name, price: pr.price }));
  return [...same, ...extra].map((x, i) => ({ ...x, img: REC_IMGS[(i + 3) % REC_IMGS.length] }));
}

/* ---------- My Requirements ---------- */
function renderRequirements() {
  if (state.openReq) return renderDetail(getReq(state.openReq));
  const q = state.reqQuery.toLowerCase();
  const list = REQS.slice().sort((a, b) => (a.ts ?? -1) - (b.ts ?? -1)).filter((r) => {
    if (q && !(r.title.toLowerCase().includes(q) || r.sellers.some((s) => S[s.id].name.toLowerCase().includes(q)))) return false;
    return true;
  });
  return `<div class="page"><div class="home-grid"><div class="home-col">


    <section class="section">
      <div class="tool-band" id="req-band">
        <label class="search"><span class="sr">Search requirement or seller</span>${ic('search', 18)}<input id="req-q" placeholder="Search requirement or seller" value="${esc(state.reqQuery)}" autocomplete="off">${state.reqQuery ? `<button type="button" class="clear-x" data-act="req-search-close" aria-label="Clear search">${ic('x', 14)}</button>` : ''}</label>
      ${state.reqQuery.trim() ? `<div class="search-hint"><span>${list.length} requirement${list.length !== 1 ? 's match' : ' matches'} “${esc(state.reqQuery.trim())}”</span><button class="btn btn-ghost btn-sm" data-act="find" data-q="${esc(state.reqQuery.trim())}">${ic('search', 13)} Find “${esc(state.reqQuery.trim())}” sellers</button></div>` : ''}
      </div>
      <div class="req-list" id="req-list">
        ${list.length ? list.map(renderReqCard).join('') : `<div class="card empty"><span class="ico">${ic('inbox', 20)}</span><b>No requirements here</b><span>Try another search, or post a new requirement.</span></div>`}
      </div>
    </section>
  </div>
  ${renderRail()}
  </div></div>`;
}

function renderReqCard(r) {
  const st = stageOf(r), meta = STAGES[st], up = reqUpdate(r), cta = reqCta(r);
  const visible = r.sellers.filter((s) => s.status !== 'rejected');
  const sl = byStatus(r, 'shortlisted').length;
  const due = st === 'ordered' ? `Due ${shortDate(r.po.due)}` : '';
  const sellersTxt = st === 'finding' ? 'No replies yet' : st === 'received' || st === 'ordered' ? S[r.po.seller].name : `${visible.length} seller${visible.length !== 1 ? 's' : ''}${sl ? ` · ${sl} shortlisted` : ''}`;
  return `<article class="req-card" data-act="open-req" data-req="${r.id}" data-closed="${r.closed ? 1 : 0}">
    <div style="min-width:0">
