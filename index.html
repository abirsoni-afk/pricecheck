        <button role="tab" class="cap cap-more" aria-selected="${tabNow === 'more'}" data-act="seller-tab" data-req="${r.id}" data-v="more">${ic('sparkles', 15)} Find more sellers</button></div>` : ''}
    </div>`;
  return `<div class="page">
    <div class="d-head">
      <div class="t"><button class="back" data-act="back">${ic('left', 15)} My Requirements</button><div class="title-row"><h1>${esc(r.title)}</h1><span class="d-more m-only"><button class="icon-btn plain" data-act="menu" data-req="${r.id}" aria-label="More actions" aria-expanded="${state.menu === r.id}">${ic('more', 20)}</button>${state.menu === r.id ? detailMenu(r) : ''}</span><span class="title-meta"><span class="muted">Posted ${shortDate(r.posted)}</span><button class="spec-link m-only" data-act="spec-toggle" data-req="${r.id}" aria-expanded="${!!state.specOpen[r.id]}">Details <span class="chev">${ic('down', 14)}</span></button></span><span class="grow"></span>${reqToolbar(r)}</div></div>
    </div>
    <div style="height:14px"></div>
    ${mSpecStrip(r)}
    ${paTop(r)}
    ${st === 'finding' ? '' : nextStep(r)}
    ${hasSeg ? bar : ''}

    ${hasSeg && tabNow === 'more'
      ? `<div class="d-main">${main}</div>`
      : `<div class="d-grid"><div class="d-main">${main}</div><aside class="d-side">${detailSide(r)}</aside></div>`}
  </div>`;
}

function nextStep(r) {
  const st = stageOf(r);
  const box = (icon, title, btn) => `<div class="next next-sm" id="next-step"><span class="ico">${ic(icon, 16)}</span><div class="tx"><b>${title}</b></div>${btn || ''}</div>`;
  if (st === 'closed') return box('ban', 'Closed', `<button class="btn btn-secondary btn-sm" data-act="reopen" data-req="${r.id}">Reopen</button>`);
  if (st === 'received') return r.rated
    ? box('repeat', 'Need it again?', `<button class="btn btn-primary btn-sm" data-act="reorder" data-req="${r.id}" id="reorder-btn">${ic('repeat', 14)} Reorder</button>`)
    : box('star', `Rate ${esc(S[r.po.seller].name)}`, `<button class="btn btn-primary btn-sm" data-act="rate" data-req="${r.id}" data-seller="${r.po.seller}">Rate</button>`);
  return '';
}

function sellerCard(r, rs, mode) {
  const s = S[rs.id], onIM = s.imProfile !== false;
  const others = r.sellers.filter((x) => x.quote && x.status !== 'rejected');
  const low = others.length > 1 && rs.quote === Math.min(...others.map((x) => x.quote));
  const total = rs.quote ? rs.quote * r.qty : null;
  const open = state.more[r.id + rs.id];
  const isFinal = rs.progress === 'finalised';
  const h = [...rs.id].reduce((a, c) => a + c.charCodeAt(0), 0);
  const product = rs.product || [`Portable ${r.title}`, r.title][h % 2];
  const callRate = Math.max(55, Math.min(97, Math.round(62 + ((s.rating || 4) - 3.6) * 22 + (h % 9))));
  const sig = rs.act && rs.act.type !== 'quote' ? `<div class="signal" data-type="${rs.act.type}">${ic(rs.act.type === 'call' ? 'phone' : rs.act.type === 'message' ? 'chat' : rs.act.type === 'sent' ? 'send' : 'file', 15)}
      <span class="tx"><b>${rs.act.type === 'call' ? 'Tried calling you' : rs.act.type === 'message' ? 'Messaged you' : ''}</b>${rs.act.type === 'call' ? '' : (rs.act.type === 'message' ? ': ' : '')}${rs.act.type === 'call' ? '' : esc(rs.act.type === 'message' ? rs.act.text.replace(/^Asked: /, '') : rs.act.text)} <span class="when">· ${esc(rs.act.when.replace(/^Today, /, ''))}</span></span>
      ${rs.act.type === 'call' ? `<button class="btn btn-primary btn-sm" data-act="call" data-seller="${rs.id}" data-req="${r.id}">${ic('phone', 13)} Call back</button>` : rs.act.type === 'message' ? `<button class="btn btn-primary btn-sm" data-act="msg" data-seller="${rs.id}" data-req="${r.id}">${ic('chat', 13)} Reply</button>` : ''}
    </div>` : '';
  const details = open && onIM ? `<div class="sc-details"><b>${esc(s.person)}</b>
      <dl><dt>Business type</dt><dd>${esc(s.kind)}</dd><dt>Company size</dt><dd>${esc(s.size)}</dd><dt>Annual turnover</dt><dd>${esc(s.turnover)}</dd><dt>Member since</dt><dd>${s.since}</dd><dt>Replies in</dt><dd>${esc(s.reply)}</dd></dl></div>` : '';
  const tIdx = TRACK_IDX[rs.progress] ?? 0;
  const progress = mode === 'short' ? `<div class="pg">${tracker(tIdx, 'Progress with ' + s.name)}
      ${tIdx === 0 ? `<button class="btn btn-secondary btn-sm pg-next" data-act="progress" data-req="${r.id}" data-seller="${rs.id}" data-v="quote_received">${ic('check', 14, 2.5)} Got the quote</button>`
        : `<button class="btn btn-primary btn-sm pg-next" data-act="po" data-req="${r.id}" data-seller="${rs.id}">${ic('send', 14)} Place order</button>`}
    </div>` : '';
  const decide = mode === 'new'
    ? `<button class="btn btn-primary btn-sm" data-act="shortlist" data-req="${r.id}" data-seller="${rs.id}">${ic('check', 14, 2.5)} Shortlist</button>
       <button class="btn btn-danger-ghost btn-sm" data-act="reject" data-req="${r.id}" data-seller="${rs.id}">${ic('x', 14)} Not for me</button>`
    : mode === 'short'
      ? `<button class="btn btn-danger-ghost btn-sm" data-act="unshortlist" data-req="${r.id}" data-seller="${rs.id}">Remove</button>`
      : mode === 'more'
        ? `<button class="btn btn-primary btn-sm" data-act="ask-req" data-req="${r.id}" data-seller="${rs.id}">${ic('send', 14)} Get quote</button>`
        : `<button class="btn btn-secondary btn-sm" data-act="shortlist" data-req="${r.id}" data-seller="${rs.id}">Shortlist</button>`;
  const fid = `inv-${r.id}-${rs.id}`;
  return `<article data-sid="${rs.id}" class="seller sc ${mode === 'short' ? 'short' : ''} ${isFinal && mode === 'short' ? 'final' : ''}" ${mode === 'rej' ? 'style="opacity:.75"' : ''}>
    <button class="fab" data-act="call" data-seller="${rs.id}" data-req="${r.id}" aria-label="Call ${esc(s.name)}">${ic('phone', 20)}</button>
    <div class="sc-main">
      <div class="sc-info">
        <h3 class="sc-name">${esc(s.name)}</h3>
        <div class="sc-loc">${ic('pin', 15)} ${esc(s.city)}${vrel(rs.id).orders.length ? ' <span class="past">· Ordered before</span>' : ''}</div>
        ${onIM ? `<button class="sc-toggle" data-act="more" data-k="${r.id + rs.id}" aria-expanded="${!!open}">Details ${ic('down', 14)}</button>` : ''}
        ${details}
        ${trustLine(rs.id)}
        ${onIM ? `<div class="sc-stats"><span>${callRate}% Calls Answered</span><span>${2026 - s.since} Years</span><span class="rt"><svg width="14" height="14" viewBox="0 0 24 24" fill="var(--star)" aria-hidden="true"><path d="M12 17.3 18.2 21l-1.6-7L22 9.2l-7.2-.6L12 2 9.2 8.6 2 9.2 7.5 14l-1.7 7z"/></svg>${s.rating}(${s.reviews})</span></div>` : ''}
      </div>
      <div class="sc-price">${mode === 'more'
        ? (s.price && s.price[r.key] ? `<b class="num range-price">${esc(s.price[r.key].split(' / ')[0])} <span>/ ${esc(s.price[r.key].split(' / ')[1] || r.unit)}</span></b><span>Price on IndiaMART</span>` : `<b class="pending">Price on request</b>`)
        : rs.quote
        ? `<b class="num">${fmtQuote(r, rs.quote)} <span>${priceUnit(r)}</span></b><span class="num">${inr(total)} for ${qtyText(r)}</span>${paTag(r, rs.quote, rs.id)}`
        : `<b class="pending">Quote pending</b>`}</div>
    </div>
    ${sig}${progress}
    <div class="sc-foot">
      <div class="sc-decide">${decide}</div>
      <div class="sc-utils">
        <button data-act="msg" data-seller="${rs.id}" data-req="${r.id}">${ic('chat', 16)} Message</button>
        ${remBtn(rs.id, r.id, 16)}
        ${onIM ? `<button data-act="verify" data-seller="${rs.id}">${ic('shield', 16)} Verify Seller</button>` : ''}
      </div>
    </div>
  </article>`;
}

    ${list.length ? `<div class="section-head"><h2>${inv.length ? 'Your past sellers' : 'Best match sellers'}</h2></div>

}

function detailOrdered(r) {

      <div class="s-actions">

        <button class="btn btn-secondary btn-sm" data-act="call" data-seller="${po.seller}" data-req="${r.id}">${ic('phone', 14)} Call</button><button class="btn btn-secondary btn-sm rem-btn" data-act="reminder" data-seller="${po.seller}" data-ctx="${r.id}" data-on="${(vrel(po.seller).reminders || []).length ? 1 : 0}">${ic('clock', 14)} Reminder</button>
        <span class="grow"></span>

    ${st === 'received' && rt ? `<section class="section" id="sec-rating"><div class="section-head"><h2>Your rating</h2><span class="hint">Private</span><span class="grow"></span>${rt ? `<button class="btn btn-ghost btn-sm" data-act="rate" data-req="${r.id}" data-seller="${po.seller}">${ic('edit', 14)} Edit</button>` : ''}</div>

function detailSide(r) {
  const st = stageOf(r);
  const tpl = TEMPLATES.rfq.find((t) => t.id === r.template);
  let html = `<div class="side-card side-spec"><h3>Requirement Details</h3>
    <dl class="kv"><dt>Quantity</dt><dd>${qtyText(r)}</dd>${r.specs.map((s) => `<dt>${esc(s[0])}</dt><dd>${esc(s[1])}</dd>`).join('')}<dt>Deliver to</dt><dd>${esc(r.location)}</dd><dt>Terms</dt><dd>${tpl ? esc(tpl.name) : '<span class="muted">None</span>'}</dd></dl></div>`;
  return html + paSide(r);
}

/* Mobile: the requirement stays hidden behind a "Details" link under the title */
function mSpecStrip(r) {
  if (!state.specOpen[r.id]) return '';
  const tpl = TEMPLATES.rfq.find((t) => t.id === r.template);
  return `<div class="m-spec m-only open"><dl class="kv"><dt>Quantity</dt><dd>${qtyText(r)}</dd>${r.specs.map((x) => `<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')}<dt>Deliver to</dt><dd>${esc(r.location)}</dd><dt>Terms</dt><dd>${tpl ? esc(tpl.name) : '<span class="muted">None</span>'}</dd></dl></div>`;
}

function ratingBars(rt) {
  const v = avgRating(rt), pos = (rt.tags || []).filter((k) => RATE_POS.some((x) => x[0] === k) || (isCustomTag(k) && v >= 4));
  return `<div class="rating-sum"><div class="rs-top">${stars(v, 16)}<b class="num">${v.toFixed(1)}</b><span class="muted">${RATE_WORD[Math.round(v)] || ''}</span></div>
    ${(rt.tags || []).length ? `<div class="rs-tags">${rt.tags.map((k) => `<span class="rate-chip ${pos.includes(k) ? 'pos' : 'neg'}" data-on="1">${pos.includes(k) ? ic('check', 12, 3) : ic('x', 12, 2.5)}${rateTagLabel(k)}</span>`).join('')}</div>` : ''}
    ${rt.note ? `<p class="rs-note">“${esc(rt.note)}”</p>` : ''}</div>`;
}

/* ---------- Find Sellers ---------- */
function renderFind() {
  const q = state.findQuery.trim(), f = state.findF;
  const pass = (id) => {
    const s = S[id];
    if (f.loc === 'near' && !s.near && s.state !== 'Delhi') return false;
    if (f.loc && f.loc !== 'near' && s.state !== f.loc) return false;
    if (s.imProfile === false) return !(f.gst || f.ts || f.r4 || f.fast);
    if (f.gst && !s.gst) return false;
    if (f.ts && !s.ts) return false;
    if (f.r4 && s.rating < 4) return false;
    if (f.fast && !['~30 min', '~1 hr', '~2 hrs'].includes(s.reply)) return false;
    return true;
  };
  const mine = myVendorIds();
  const all = Object.keys(S);
  const mineHits = q ? mine.filter((id) => matchItem(id, q) && pass(id)) : [];
  const newHits = q ? all.filter((id) => !mine.includes(id) && S[id].imProfile !== false && matchItem(id, q) && pass(id)).sort((a, b) => S[b].rating - S[a].rating) : [];
  const states = [...new Set(all.map((id) => S[id].state))].sort();
  const fchip = (k, l) => `<button class="chip" aria-pressed="${f[k]}" data-act="find-f" data-k="${k}">${l}</button>`;
  return `<div class="page"><div class="find-hero">
    <form data-form="find" style="display:flex;gap:10px;flex-wrap:wrap">
      <label class="search" style="flex:1 1 300px"><span class="sr">Product or seller</span>${ic('search', 18)}<input id="find-q" placeholder="Search a product, e.g. SS pipe" value="${esc(q)}" autocomplete="off"></label>
      <button class="btn btn-primary btn-lg" type="submit">Search</button></form>
    <div class="filters" id="find-filters">
      <select class="select" id="find-loc" aria-label="Location"><option value="">All India</option><option value="near" ${f.loc === 'near' ? 'selected' : ''}>Near me (Delhi NCR)</option>${states.map((s) => `<option ${f.loc === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      ${fchip('gst', 'GST verified')}${fchip('ts', 'TrustSEAL')}${fchip('r4', '4★ and above')}${fchip('fast', 'Replies within 2 hrs')}
    </div></div>
    ${q ? `
    <section class="section" style="margin-top:22px" id="find-mine"><div class="section-head"><h2>From your vendors</h2><span class="pill" data-tone="brand">${mineHits.length}</span><span class="hint">Sellers you have ordered from, shortlisted or added</span></div>
      ${mineHits.length ? `<div class="find-grid">${mineHits.map((id) => findCard(id, true, q)).join('')}</div>` : `<div class="card empty" style="padding:18px"><span>None of your vendors list “${esc(q)}”.</span></div>`}</section>
    <section class="section" style="margin-top:22px" id="find-new"><div class="section-head"><h2>New sellers on IndiaMART</h2><span class="pill" data-tone="info">${newHits.length}</span><span class="hint">Sorted by rating</span></div>
      ${newHits.length ? `<div class="find-grid">${newHits.map((id) => findCard(id, false, q)).join('')}</div>` : `<div class="card empty"><span class="ico">${ic('search', 20)}</span><b>No sellers match these filters</b><span>Remove a filter, or post a requirement and let sellers come to you.</span><button class="btn btn-primary btn-sm" data-act="post" data-q="${esc(q)}">Post requirement</button></div>`}</section>`
    : `<section class="section" style="margin-top:22px"><div class="section-head"><h2>Suggested products</h2><span class="hint">Based on what you buy</span></div>
      <div class="prod-grid">${SUGG_PRODUCTS.map((p) => `<button class="pcard" data-act="find" data-q="${esc(p.q)}"><span class="img" style="background:${['var(--brand-wash)', 'var(--navy-wash)', 'var(--warn-wash)', 'var(--good-wash)'][p.tint]};color:${['var(--brand-strong)', 'var(--navy)', 'var(--warn)', 'var(--good)'][p.tint]}">${initials(p.name)}</span><b>${esc(p.name)}</b><span class="pr num">${esc(p.price)}</span><span class="w">${esc(p.why)}</span></button>`).join('')}</div></section>
    <section class="section" style="margin-top:22px"><div class="section-head"><h2>Suggested sellers</h2><span class="hint">Verified sellers for items you buy</span></div>
      <div class="find-grid">${SUGG_SELLERS.map((x) => findCard(x.id, false, S[x.id].items[0], x.why)).join('')}</div></section>`}
  </div>`;
}
function findCard(id, mine, q, why) {
  const s = S[id], rel = vrel(id), rt = avgRating(rel.rating);
  const priceKey = s.price && Object.keys(s.price).find((k) => q.toLowerCase().includes(k) || k.includes(q.toLowerCase()) || matchItem(id, k));
  const last = rel.orders[0];
  return `<article class="fcard">
    <div class="s-top">${logo(id)}<div class="s-name"><b>${esc(s.name)}</b><div class="tags">${trustTags(id)}${nearTag(id)}</div></div></div>
    <div class="meta">${s.imProfile !== false ? `<span>${s.rating}★ (${s.reviews})</span><span>${ic('clock', 12)} Replies ${esc(s.reply)}</span>` : ''}<span>${ic('pin', 12)} ${esc(s.city)}</span>${s.since ? `<span>${yrs(s.since)} on IndiaMART</span>` : ''}</div>
    ${priceKey ? `<div><span class="muted" style="font-size:12px">Price on IndiaMART</span><br><b class="num">${esc(s.price[priceKey])}</b></div>` : ''}
    ${mine ? `<div class="why">${last ? `Last order ${last.date} · ${inr(last.amount)}` : 'On your shortlist'}${rt ? ` · your rating ${rt.toFixed(1)}★` : ''}</div>` : why ? `<div class="why">${esc(why)}</div>` : ''}
    <div class="acts">
      ${mine && last ? `<button class="btn btn-primary btn-sm" data-act="reorder-vendor" data-seller="${id}">${ic('repeat', 14)} Reorder</button><button class="btn btn-secondary btn-sm" data-act="ask-quote" data-seller="${id}" data-q="${esc(q)}">Get quote</button>`
        : `<button class="btn btn-primary btn-sm" data-act="ask-quote" data-seller="${id}" data-q="${esc(q)}">Get quote</button>`}
      <button class="icon-btn" data-act="call" data-seller="${id}" aria-label="Call">${ic('phone', 15)}</button>
      ${mine ? `<button class="icon-btn" data-act="vendor" data-seller="${id}" aria-label="Vendor details">${ic('right', 15)}</button>` : ''}
    </div></article>`;
}

/* ---------- My Vendors ---------- */
function renderVendors() {
  const ids = myVendorIds();
  const counts = { all: ids.length, shortlisted: 0, ordered: 0, outside: 0 };
  ids.forEach((id) => vendorSegs(id).forEach((s) => counts[s]++));
  const q = state.vendorQuery.toLowerCase();
  const list = ids.filter((id) => {
    if (STATE_ON(state.vendorSeg) && !vendorStates(id).has(state.vendorSeg)) return false;
    if (state.vendorSeg === 'outside' && S[id].imProfile !== false) return false;
    if (state.vendorRated && !vrel(id).rating) return false;
    const s = S[id];
    if (q && !(s.name.toLowerCase().includes(q) || s.city.toLowerCase().includes(q) || s.items.some((i) => i.includes(q)) || vrel(id).orders.some((o) => o.item.toLowerCase().includes(q)))) return false;
    return true;
  });
  return `<div class="page" style="display:flex;flex-direction:column;gap:16px">
    <section class="section tool-band">
      <div class="search-full ven-search">
        <label class="search"><span class="sr">Search vendor, product or city</span>${ic('search', 18)}<input id="vendor-q" placeholder="Search vendor, product or city" value="${esc(state.vendorQuery)}" autocomplete="off">${state.vendorQuery ? `<button type="button" class="clear-x" data-act="ven-search-close" aria-label="Clear search">${ic('x', 16)}</button>` : ''}</label>
        <button class="btn btn-secondary" data-act="invoice" id="add-vendor-btn" aria-label="Add vendor" title="Add vendor">${ic('plus', 16, 2.5)}<span class="lbl">Add vendor</span></button>
      </div>
      ${state.vendorQuery.trim() && list.length ? `<div class="search-hint"><span>${list.length} of your vendor${list.length !== 1 ? 's' : ''} for “${esc(state.vendorQuery.trim())}”</span><button class="btn btn-ghost btn-sm ai-find" data-act="find" data-q="${esc(state.vendorQuery.trim())}"><span class="spark">${ic('sparkles', 14)}</span> Find best vendors for “${esc(state.vendorQuery.trim())}”</button></div>` : ''}
      <button class="fab-add" data-act="invoice" aria-label="Add vendor">${ic('plus', 20, 2.5)}<span>Add vendor</span></button>
      <div class="list-tools" id="ven-tools">
      <div class="chips chips-row" role="group" aria-label="Vendor groups">
        ${STATE4.map(([k, l]) => { const n = ids.filter((id) => vendorStates(id).has(k)).length; return `<button class="chip" aria-pressed="${state.vendorSeg === k}" data-act="vseg" data-v="${k}">${l}<span class="n">${n}</span></button>`; }).join('')}<button class="chip" aria-pressed="${state.vendorSeg === 'outside'}" data-act="vseg" data-v="outside">Added by you<span class="n">${ids.filter((id) => S[id].imProfile === false).length}</span></button>
      </div>
      </div></section>

/* Re-render without the page jumping: keep the seller card next to the one acted on at the same spot on screen */
function stayPut(sellerId, fn) {
  const cards = [...document.querySelectorAll('article.seller[data-sid]')];
  const i = cards.findIndex((c) => c.dataset.sid === sellerId);
  const anchors = i < 0 ? [] : [cards[i + 1], cards[i - 1]].filter(Boolean).map((c) => c.dataset.sid);
  const top = (id) => { const el = document.querySelector(`article.seller[data-sid="${id}"]`); return el ? el.getBoundingClientRect().top : null; };
  const before = anchors.map(top);
  fn();
  const k = anchors.findIndex((id, j) => before[j] != null && top(id) != null);
  if (k < 0) return;
  const d = top(anchors[k]) - before[k];
  const main = document.getElementById('main');
  if (main.scrollHeight > main.clientHeight + 1 && getComputedStyle(main).overflowY !== 'visible') main.scrollTop += d; else window.scrollBy(0, d);
}
function go(view, extra = {}) {
  state.view = view; state.menu = null; Object.assign(state, extra);

}

}

function markScrollers() {
  document.querySelectorAll('.chips.chips-row, .ov .rec-row').forEach((c) => {
    let w = c.parentElement;
    if (!w.classList.contains('chips-wrap')) {
      w = document.createElement('div'); w.className = 'chips-wrap' + (c.classList.contains('rec-row') ? ' rr-wrap' : ''); c.parentNode.insertBefore(w, c); w.appendChild(c);
      const mk = (dir) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chips-more ' + dir; b.setAttribute('aria-label', c.classList.contains('rec-row') ? (dir === 'r' ? 'Next cards' : 'Previous cards') : (dir === 'r' ? 'More filters' : 'Previous filters')); b.innerHTML = ic(dir === 'r' ? 'right' : 'left', 16, 2.5); b.addEventListener('click', (e) => { e.stopPropagation(); c.scrollBy({ left: (dir === 'r' ? 1 : -1) * c.clientWidth * 0.7, behavior: 'smooth' }); }); return b; };
      w.appendChild(mk('l')); w.appendChild(mk('r'));
      c.addEventListener('scroll', () => upd(c, w), { passive: true });
    }
    upd(c, w);
  });
  function upd(c, w) {
    const over = c.scrollWidth > c.clientWidth + 2;
    w.dataset.l = over && c.scrollLeft > 4 ? '1' : '0';
    w.dataset.r = over && c.scrollLeft + c.clientWidth < c.scrollWidth - 4 ? '1' : '0';
  }
}

    }
    case 'reorder': openModal({ type: 'reorder-ask', req: d.req }); break;
    case 'reorder-edit': openModal({ ...state.modal, type: 'reorder' }); break;
    case 'reorder-same': { const c = roCtx(state.modal); sendReorder(c.sid, c.item, c.qty, c.unit, false); break; }
    case 'reorder-vendor': {
      const src = REQS.find((x) => x.po && x.po.seller === d.seller && x.receivedOn);
      openModal(src ? { type: 'reorder-ask', req: src.id } : { type: 'reorder-ask', seller: d.seller }); break;
    }
    case 'invite': r.sellers.push({ id: d.seller, status: 'new', quote: null, act: { type: 'sent', text: 'You requested a quote on WhatsApp and SMS', when: 'Just now' } }); render(); snack(`Quote requested from ${S[d.seller].name}`); break;
    case 'find': closeModal(); go('find', { findQuery: d.q || '', openReq: null }); break;
    case 'find-f': state.findF[d.k] = !state.findF[d.k]; render(); break;
    case 'ask-quote': {
      const q = (d.q || '').toLowerCase();
      const ex = REQS.find((x) => !x.closed && !x.po && (x.key.includes(q) || q.includes(x.key) || matchItem(d.seller, x.key) && x.title.toLowerCase().includes(q.split(' ')[0])));
      if (ex && !ex.sellers.some((x) => x.id === d.seller)) {
        ex.sellers.push({ id: d.seller, status: 'new', quote: null, act: { type: 'sent', text: 'You asked for a quote', when: 'Just now' } });
        render(); snack(`Asked ${S[d.seller].name} to quote on “${ex.title}”`);
      } else if (ex) snack(`${S[d.seller].name} already has your “${ex.title}” requirement`);
      else openModal({ type: 'post', product: d.q ? d.q.replace(/\b\w/g, (c) => c.toUpperCase()) : '', sendTo: [d.seller], pendingSeller: d.seller });
      break;
    }
    case 'vseg': state.vendorSeg = state.vendorSeg === d.v ? 'all' : d.v; render(); break;
    case 'vrated': state.vendorRated = !state.vendorRated; render(); break;
    case 'vendor': openModal({ type: 'vendor', seller: d.seller }); break;
    case 'vendor-page': { const sv = S[d.seller]; snack(sv.imProfile === false ? `${sv.name} doesn’t have an IndiaMART company page yet` : `Opening ${sv.name}’s company page…`, 2600, '<span class="snack-ring">' + ic('building', 15) + '</span>'); break; }
    case 'trust': openModal({ type: 'trust', seller: d.seller, back: 'vendor' }); break;
    case 'trust-order': vrel(d.seller).trust = Object.assign(vrel(d.seller).trust || {}, { requested: TODAY }); openModal({ type: 'vendor', seller: d.seller }); snack('TrustProfile ordered. Ready in 1–2 working days.'); break;
    case 'copy': { const t = d.text; try { navigator.clipboard.writeText(t).then(() => snack('Number copied'), () => snack('Select the number to copy it')); } catch (_) { snack('Select the number to copy it'); } break; }
    case 'invoice': openModal({ type: 'invoice', manual: !!d.manual }); break;
    case 'tpl-edit': openModal({ type: 'tpl', kind: d.kind, id: d.id }); break;
    case 'tpl-row': { const rows = [...document.querySelectorAll('#tpl-rows .inline')].map((x) => [x.querySelector('.tpl-k').value, x.querySelector('.tpl-v').value]); rows.push(['', '']); state.modal.rows = rows; renderOverlay(); break; }
    case 'tpl-use':
      if (d.kind === 'rfq') openModal({ type: 'post', tpl: d.id });
      else { const fr = REQS.find((x) => !x.po && x.sellers.some((s) => s.progress === 'finalised')); if (fr) openModal({ type: 'po', req: fr.id, seller: fr.sellers.find((s) => s.progress === 'finalised').id, tpl: d.id }), setTimeout(updatePOTotal, 0); else snack('Finalise a seller on a requirement first, then send the purchase order from there'); }
      break;
    case 'pa-open': closeModal(); state.paPseudo = null; state.paMiss = null; go('prices', { openReq: null, paReq: d.req || state.paReq }); break;
    case 'pa-pick': if (d.req) paLaunch({ req: d.req }); else if (d.mcat) paLaunch({ pseudo: paCatPseudo(PA_CAT.find((c) => String(c.mcat) === String(d.mcat))) }); break;
    case 'pa-load': paLaunch(d); break;
    case 'pa-quick': paSearchEnter(d.v); break;
    case 'pa-hookinfo': state.paHookInfo = !state.paHookInfo; render(); break;
    case 'pa-dbg-tog': state.paDebug = !state.paDebug; render(); break;
    case 'pa-dbg': openModal({ type: 'padbg', k: d.k }); break;
    case 'pa-dbg-copy': { const x = paSpec(d.k); try { navigator.clipboard.writeText(JSON.stringify(x, null, 2)).then(() => snack('Copied for your developer'), () => snack('Copy not allowed here')); } catch (_) { snack('Copy not allowed here'); } break; }
    case 'pa-clear': state.paMiss = ''; render(); setTimeout(() => document.getElementById('pa-search')?.focus(), 0); break;
    case 'doc-seg': state.docSeg = d.v; render(); break;
    case 'pa-check': { const rr = getReq(d.req); openModal({ type: 'pacheck', req: d.req, res: d.v ? { req: d.req, price: +d.v, unit: paK(pa(rr)).u.unit_display_name, seller: d.seller || null } : null }); break; }
    case 'pa-band': state.paBand = state.paBand === +d.v ? null : +d.v; render(); break;
    case 'pa-tband': state.paTBand = d.v === '1'; render(); break;
    case 'pa-find': { const rr = getReq(d.req); closeModal(); go('requirements', { openReq: rr.id }); state.sellerTab[rr.id] = 'more'; if (!state.curated[rr.id]) startCurated(rr); else render(); break; }
    case 'pa-go': paRun(d.ctx, d.req); break;
    case 'pa-try': paRun(d.ctx, d.req, +d.v, d.seller); break;
    case 'pa-free': state.paFree = d.v === '1'; render(); break;
    case 'pa-more-c': state.paCities = true; render(); break;
    case 'pa-expand': state.paExp = state.paExp || {}; state.paExp[d.req] = !state.paExp[d.req]; render(); break;
    case 'pa-how': openModal({ type: 'pahow' }); break;
    case 'pa-up': snack('Opens paid plans for buyers'); break;
    case 'pa-nego': openModal({ type: 'docuse', id: 'd-m2', req: d.req, seller: d.seller }); break;
    case 'open-notes': openModal({ type: 'notes' }); break;
    case 'show-note': showNote(NOTES[+d.i].go); break;
    case 'close': if (state.modal?.back === 'vendor') openModal({ type: 'vendor', seller: state.modal.seller }); else closeModal(); break;
    case 'close-bg': if (e.target === el) closeModal(); break;
  }
});

function showNote([kind, target, x = {}]) {
  closeModal();
  if (kind === 'prices') { go('prices', { openReq: null }); flash(target); }
  else if (kind === 'find') { go('find', { findQuery: x.q || '', openReq: null }); flash(target); }
  else if (kind === 'req') { go('requirements', { openReq: x.req }); flash(target); }
  else if (kind === 'home') { go('requirements', { openReq: null, reqFilter: null }); flash(target); }
  else if (kind === 'templates') { go('templates'); flash(target); }
  else if (kind === 'vendor') { go('vendors', { openReq: null }); openModal({ type: 'vendor', seller: x.seller }); flash(target); }
  else if (kind === 'modal') {
    if (x.view) go(x.view, { openReq: null });
    const m = { ...x }; delete m.view;
    if (m.type === 'rate') m.draft = Object.assign({ quality: 0, price: 0, delivery: 0, comm: 0 }, vrel(m.seller).rating || {});
    openModal(m); if (target) flash(target);
  }
}

function startParse(file) {
  state.modal = { type: 'invoice', step: 'parsing', file }; renderOverlay();
  setTimeout(() => {
    if (state.modal?.type !== 'invoice') return;
    state.modal = { type: 'invoice', step: 'review', file, data: { name: 'Gupta Hardware & Tools', gstin: '07AAGFG4521M1Z3', phone: '98112 34567', city: 'New Delhi', date: '09 Oct 2026', items: 'Hand tools, fasteners, safety gloves', amount: '₹18,640' } };
    renderOverlay();
  }, 1300);
}

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'file-add' && t.files[0]) { vrel(t.dataset.seller).files.unshift({ n: t.files[0].name, t: /\.pdf$/i.test(t.files[0].name) ? 'pdf' : 'img', d: TODAY }); renderOverlay(); snack('File added'); }
  if (t.classList.contains('seller-inv') && t.files[0]) { vrel(t.dataset.seller).files.unshift({ n: t.files[0].name, t: /\.pdf$/i.test(t.files[0].name) ? 'pdf' : 'img', d: TODAY }); snack(`Invoice saved to ${S[t.dataset.seller].name}’s files`); }
  if (t.id === 'sf-sort') { sf(t.dataset.req).sort = t.value; render(); }
  if (t.id === 'find-loc') { state.findF.loc = t.value; render(); }
  if (t.id === 'pa-req' && t.value !== '__s') paLaunch({ req: t.value });
  if (t.id === 'po-tpl') { state.modal.tpl = t.value; renderOverlay(); updatePOTotal(); }
  if (t.classList.contains('po-calc')) updatePOTotal();
});
document.addEventListener('input', (e) => {
  const t = e.target;
  const keepFocus = (id, fn) => { const pos = t.selectionStart; fn(); const n = document.getElementById(id); if (n) { n.focus(); n.setSelectionRange(pos, pos); } };
  if (t.id === 'req-q') keepFocus('req-q', () => { state.reqQuery = t.value; render(); });
  if (t.id === 'vendor-q') keepFocus('vendor-q', () => { state.vendorQuery = t.value; render(); });
  if (t.id === 'tpl-q') keepFocus('tpl-q', () => { state.tplQ = t.value; render(); });
  if (t.classList.contains('po-calc')) updatePOTotal();
  if (t.id && t.id.startsWith('pa-q-')) { const dg = t.value.replace(/\D/g, '').slice(0, 10); t.value = dg ? (+dg).toLocaleString('en-IN') : ''; }
  if (t.id === 'pa-search') { const dd = document.getElementById('pa-drop'); dd.innerHTML = paDrop(t.value); dd.hidden = false; }
  if (t.id === 'doc-q') keepFocus('doc-q', () => { state.docQ = t.value; render(); });
  if (t.id === 'post-product') {
    state.modal.product = t.value;
    const sendTo = [...document.querySelectorAll('input[name="sendto"]:checked')].map((x) => x.value);
    const box = document.getElementById('post-vendors');
    const suggest = t.value.length > 2 ? myVendorIds().filter((id) => matchItem(id, t.value)) : [];
    box.innerHTML = suggest.length ? `<span class="lab">Also send to your vendors</span>${suggest.map((id) => `<label class="check" style="margin-top:6px"><input type="checkbox" name="sendto" value="${id}" ${sendTo.includes(id) || !sendTo.length ? 'checked' : ''}><span>${esc(S[id].name)}<small>${esc(S[id].city)}${vrel(id).orders[0] ? ` · last order ${vrel(id).orders[0].date}` : ''}</small></span></label>`).join('')}` : `<span class="muted" style="font-size:12.5px">Type a product name to see which of your vendors supply it.</span>`;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (state.modal) closeModal(); else if (state.menu) { state.menu = null; render(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.req-card,.v-row')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target.dataset.form, val = (id) => (document.getElementById(id)?.value || '').trim();
  if (f === 'ov-pa') { const q = document.getElementById('ov-pa-q').value; if (q.trim()) paSearchEnter(q); else go('prices', { openReq: null }); return; }
  if (f === 'pa-search') { paSearchEnter(document.getElementById('pa-search').value); return; }
  if (f === 'pa-check') { paRun(e.target.dataset.ctx, e.target.dataset.req); return; }
  if (f === 'hero-find') { go('find', { findQuery: val('hero-q') }); return; }
  if (f === 'find') { state.findQuery = val('find-q'); render(); return; }
  if (f === 'post') {
    const m = state.modal, name = val('post-product');
    if (!name) { snack('Add a product name to post your requirement'); return; }
    const sendTo = [...document.querySelectorAll('input[name="sendto"]:checked')].map((x) => x.value);
    if (m.pendingSeller && !sendTo.includes(m.pendingSeller)) sendTo.push(m.pendingSeller);
    if (m.editId) { const r = getReq(m.editId); r.title = name; r.qty = +val('post-qty') || r.qty; r.unit = val('post-unit'); r.location = val('post-loc'); r.template = val('post-tpl') || null; closeModal(); render(); snack('Requirement updated. Sellers see the changes.'); return; }
    const r = { id: 'r' + nextReq++, title: name, key: name.toLowerCase(), qty: +val('post-qty') || 1, unit: val('post-unit'), specs: val('post-details') ? [['Details', val('post-details')]] : [['Details', 'As discussed']], posted: 'Just now', ts: -1, location: val('post-loc'), template: val('post-tpl') || null, market: null,
      sellers: sendTo.map((id) => ({ id, status: 'new', quote: null, act: { type: 'sent', text: 'You sent this requirement', when: 'Just now' } })) };
    REQS.unshift(r); closeModal(); go('requirements', { openReq: null, reqFilter: null });
    snack(`Requirement posted${sendTo.length ? ` and sent to ${sendTo.length} of your vendor${sendTo.length > 1 ? 's' : ''}` : ''}`); flash('req-list'); return;
  }
  if (f === 'po') {
    const m = state.modal, r = getReq(m.req);
    const qty = +val('po-qty'), rate = +val('po-rate'), gst = +val('po-gst');
    if (!(qty > 0 && rate > 0)) { snack('Add quantity and rate to send the purchase order'); return; }
    const no = 'PO-00' + (13 + REQS.filter((x) => x.po).length);
    r.po = { no, seller: m.seller, amount: qty * rate * (1 + gst / 100), sent: TODAY, due: new Date(val('po-date') || '2026-10-26').toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }), accepted: false, tpl: val('po-tpl') };
    r.sellers.find((x) => x.id === m.seller).progress = 'finalised';
    vrel(m.seller).files.unshift({ n: `${no} ${r.title}.pdf`, t: 'pdf', d: TODAY });
    closeModal(); render(); snack(`${no} sent to ${S[m.seller].name}. We’ll remind you on the delivery date.`); return;
  }
  if (f === 'reorder') {
    sendReorder(val('ro-seller'), val('ro-item'), +val('ro-qty') || 1, val('ro-unit'), document.getElementById('ro-more')?.checked); return;
  }
  if (f === 'vendor') {
    const name = val('v-name'), phone = val('v-phone');
    if (!name || !phone) { snack('Add the vendor’s name and mobile number'); return; }
    const id = 'v' + Date.now();
    const m = state.modal;
    S[id] = { name, person: name, city: val('v-city') || '—', state: 'Delhi', imProfile: false, mobile: phone, items: (val('v-items') || 'general supplies').toLowerCase().split(/,\s*/) };
    V[id] = { orders: m.step === 'review' ? [{ item: val('v-items').split(',')[0], date: val('v-date'), amount: +val('v-amount').replace(/[^\d]/g, ''), via: 'invoice' }] : [], rating: null, files: m.step === 'review' ? [{ n: m.file, t: /\.pdf$/i.test(m.file) ? 'pdf' : 'img', d: TODAY }] : [] };
    closeModal(); state.vendorSeg = 'outside'; go('vendors'); snack(`${name} added to My Vendors`); return;
  }
  if (f === 'tpl') {
    const m = state.modal, list = TEMPLATES[m.kind];
    const terms = [...document.querySelectorAll('#tpl-rows .inline')].map((x) => [x.querySelector('.tpl-k').value.trim(), x.querySelector('.tpl-v').value.trim()]).filter((x) => x[0] && x[1]);
    const name = val('tpl-name');
    if (!name) { snack('Give the template a name'); return; }
    const ex = list.find((x) => x.id === m.id);
    if (ex) Object.assign(ex, { name, note: val('tpl-note'), terms });
    else list.push({ id: m.kind[0] + Date.now(), name, note: val('tpl-note'), terms, used: 0 });
    closeModal(); render(); snack('Template saved'); return;
  }
});

render();
</script>
